<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawer Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #e9e6df;
  --paper-2: #d8d4cb;
  --ink: #1a1a1a;
  --mute: #6d6a63;
  --orange: #ff5a1f;
  --mono: "IBM Plex Mono", "Courier New", monospace;
  --sans: "Plus Jakarta Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #bdb8ad; color: var(--ink); font-family: var(--sans); overflow-x: hidden; }
.page { padding: 40px 16px 80px; display: flex; flex-direction: column; gap: 56px; align-items: center; }
.ver { width: 100%; max-width: 1440px; }
.tag { font-family: var(--mono); font-size: 14px; margin-bottom: 12px; color: #2b2a27; }
.tag b { font-weight: 600; }
.scaler { width: 100%; aspect-ratio: 1440 / 900; position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.frame { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--paper-2); display: flex; flex-direction: column; }
body.solo { background: #000; }
body.solo .page { padding: 0; gap: 0; }
body.solo .tag { display: none; }
body.solo .scaler { border-radius: 0; box-shadow: none; }

/* ---------- deck replica (unchanged across versions) ---------- */
.deck { height: 128px; flex: none; display: flex; align-items: center; gap: 24px; padding: 0 28px; background: linear-gradient(#ebe8e1, #e2ded6); border-bottom: 1px solid #b9b4a8; position: relative; z-index: 2; }
.deck > * { flex: none; }
.deck .spk { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle, #2a2a2a 1.6px, transparent 2px) 0 0 / 8px 8px; }
.deck .btns { display: flex; gap: 16px; }
.deck .btn { width: 50px; height: 50px; border-radius: 50%; background: #4a4a4a; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); position: relative; }
.deck .btn::before { content: ""; position: absolute; top: -16px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #9a968e; }
.deck .btn.ej { background: #9aa6b2; } .deck .btn.on { background: var(--orange); } .deck .btn.on::before { background: var(--orange); }
.deck .disp { flex: 1 1 auto; min-width: 0; overflow: hidden; height: 80px; background: #0c0c0c; border-radius: 6px; display: flex; align-items: center; gap: 32px; padding: 0 24px; font-family: var(--sans); color: #eee; }
.deck .disp .k { font-size: 9px; color: #8a8a8a; width: 40px; text-align: right; font-family: var(--mono); }
.deck .disp .row { display: flex; gap: 10px; align-items: baseline; margin: 3px 0; white-space: nowrap; }
.deck .disp .song { color: var(--orange); font-size: 19px; font-weight: 500; }
.deck .disp .eq { margin-left: auto; flex: none; display: flex; gap: 3px; align-items: flex-end; height: 50px; }
.deck .disp .eq i { width: 5px; background: var(--orange); display: block; }
.deck .knobs { display: flex; gap: 16px; }
.deck .knob { display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--mono); font-size: 9px; color: #444; }
.deck .knob span { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fbfaf7, #d7d3cb); box-shadow: 0 2px 3px rgba(0,0,0,.25); position: relative; }
.deck .knob span::after { content: ""; position: absolute; left: 50%; top: 8px; width: 2px; height: 12px; background: #222; transform-origin: 50% 15px; }
.drawer { flex: 1; min-height: 0; position: relative; }

/* ---------- shared filter swatches ---------- */
.sw { position: relative; overflow: hidden; background: #111; }
.sw[data-f="0"] { background: #111; }
.sw[data-f="1"] { background: repeating-linear-gradient(#e9e6df 0 6px, #111 6px 10px); }
.sw[data-f="2"] { background: radial-gradient(circle, transparent 0 9px, var(--orange) 9px 10px, transparent 10px 15px, var(--orange) 15px 16px, transparent 16px) center / 100% 100% no-repeat, #e9e6df; }
.sw[data-f="3"] { background: radial-gradient(circle, var(--orange) 1px, transparent 1.5px) 0 0 / 6px 6px, #111; }
.sw[data-f="4"] { background: linear-gradient(90deg, #111 0 20%, #d33 20% 40%, #3a3 40% 60%, #33d 60% 80%, #111 80%); }
.sw[data-f="5"] { background: linear-gradient(#e9e6df 0 30%, #bbb 30% 34%, #e9e6df 34% 70%, #999 70% 73%, #e9e6df 73%); }
.sw[data-f="6"] { background: linear-gradient(#ddd 0 33%, #888 33% 66%, #111 66%); }
.sw[data-f="7"] { background: conic-gradient(#111 25%, #e9e6df 0 50%, #111 0 75%, #e9e6df 0) 0 0 / 12px 12px; }
.sw[data-f="8"] { background: linear-gradient(135deg, #111 50%, #ddd 50%); }
.sw[data-f="9"] { background: radial-gradient(circle, var(--orange) 3px, transparent 3.5px) 0 0 / 10px 10px, #1a0f08; }
.sw[data-f="10"] { background: radial-gradient(circle, #111 .9px, transparent 1.2px) 0 0 / 4px 4px, #e9e6df; }
.sw[data-f="11"] { background: linear-gradient(#111 0 22%, #4dd 22% 24%, #111 24% 48%, #f46 48% 50%, #111 50% 74%, #4dd 74% 76%, #111 76%); }
.sw[data-f="12"] { background: linear-gradient(90deg, #111 0 50%, #888 50% 75%, #e9e6df 75%); }
.th { background-size: cover; background-position: center; }
/* Screenshots are square: grid stills stay square. */
.v1 .cell .th, .v2 .cell .th, .v3 .shelf .th, .v4 .cell .th, .v9 .cell .th { flex: none; aspect-ratio: 1; }
.v5 .cell, .v7 .mon { aspect-ratio: 1; }
.v6 .row .th, .v8 .it .th { width: 30px; }
.v6 .row { grid-template-columns: 34px 30px 1fr 48px; } .v8 .it { grid-template-columns: 26px 30px 1fr; }

/* ================= V1 · Teletext index ================= */
.v1 .drawer { background: #000; color: #fff; font-family: var(--mono); padding: 22px 40px 0; display: grid; grid-template-rows: auto auto 1fr; gap: 16px; }
.v1 .bar { display: flex; justify-content: space-between; font-size: 18px; }
.v1 .bar .p { background: #00e5ff; color: #000; padding: 0 10px; }
.v1 .bar .y { color: #ffe600; }
.v1 .fl { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 18px; font-size: 16px; }
.v1 .fl div { display: flex; gap: 10px; align-items: center; padding: 3px 0; }
.v1 .fl .n { color: #00e5ff; }
.v1 .fl .on { background: #ffe600; color: #000; padding: 3px 8px; margin: 0 -8px; }
.v1 .fl .on .n { color: #000; }
.v1 .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 14px 16px; min-height: 0; padding-bottom: 26px; }
.v1 .cell { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.v1 .cell .th { flex: 1; min-height: 0; image-rendering: pixelated; }
.v1 .cell .nm { font-size: 13px; display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
.v1 .cell .nm .n { color: #00e5ff; }
.v1 .cell.on .nm { color: #ffe600; }
.v1 .cell.on .th { outline: 3px solid #ffe600; outline-offset: 3px; }

/* ================= V2 · Contact sheet ================= */
.v2 .drawer { background: #2b2a28; padding: 26px 48px 30px; display: grid; grid-template-rows: auto 1fr; gap: 22px; }
.v2 .fl { display: flex; gap: 0; border: 1px solid #4a4843; }
.v2 .fl div { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #4a4843; }
.v2 .fl div:last-child { border-right: 0; }
.v2 .fl .sw { height: 46px; }
.v2 .fl span { font-family: var(--mono); font-size: 11px; color: #c9c5bb; padding: 7px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2 .fl .on span { color: var(--orange); }
.v2 .fl .on { box-shadow: inset 0 -2px 0 var(--orange); }
.v2 .sheet { background: #121110; padding: 18px 18px 6px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 10px 10px; min-height: 0; }
.v2 .cell { display: flex; flex-direction: column; min-height: 0; position: relative; }
.v2 .cell .th { flex: 1; min-height: 0; }
.v2 .cell .nm { font-family: var(--mono); font-size: 11px; color: #a7a39a; padding: 5px 0 6px; display: flex; gap: 8px; justify-content: space-between; white-space: nowrap; }
.v2 .cell .nm span:first-child { overflow: hidden; text-overflow: ellipsis; }
.v2 .cell .nm .n { color: #e8a33a; }
.v2 .cell.on::after { content: ""; position: absolute; inset: -6px -6px 14px; border: 3px solid var(--orange); border-radius: 46% 54% 50% 48% / 50% 46% 54% 50%; transform: rotate(-1.5deg); }

/* ================= V3 · Tape library ================= */
.v3 .drawer { background: #e4e0d7; display: grid; grid-template-columns: 300px 1fr; }
.v3 .spines { border-right: 1px solid #c4bfb3; padding: 22px 0 22px 28px; display: flex; flex-direction: column; gap: 4px; }
.v3 .spine { height: 46px; display: grid; grid-template-columns: 40px 1fr; align-items: center; background: #f4f2ec; border: 1px solid #cdc8bc; border-right: 0; font-family: var(--mono); font-size: 13px; }
.v3 .spine .sw { height: 100%; }
.v3 .spine span { padding: 0 14px; }
.v3 .spine.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.v3 .spine.on span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); margin-right: 9px; vertical-align: 1px; }
.v3 .spine i { display: none; }
.v3 .shelf { padding: 22px 32px 22px 28px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 12px 14px; min-height: 0; }
.v3 .shelf .cell { display: flex; flex-direction: column; background: #f7f5f0; border: 1px solid #d0cbbf; padding: 6px; min-height: 0; }
.v3 .shelf .th { flex: 1; min-height: 0; }
.v3 .shelf .nm { font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 6px 2px 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; }
.v3 .shelf .nm::before { content: ""; width: 3px; flex: none; background: linear-gradient(#c9302c 0 33%, #e8a33a 33% 66%, #2a6fb0 66%); }
.v3 .shelf .on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

/* ================= V4 · Museum labels ================= */
.v4 .drawer { background: #f1efea; padding: 34px 64px 30px; display: grid; grid-template-rows: auto 1fr; gap: 30px; }
.v4 .fl { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 6px 12px; font-size: 13px; color: #6d6a63; align-items: center; }
.v4 .fl div { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.v4 .fl .sw { width: 14px; height: 14px; border-radius: 50%; }
.v4 .fl .on { color: var(--ink); font-weight: 600; }
.v4 .fl .on .sw { box-shadow: 0 0 0 2px #f1efea, 0 0 0 3.5px var(--orange); }
.v4 .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 18px 22px; min-height: 0; }
.v4 .cell { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.v4 .cell .th { flex: 1; min-height: 0; }
.v4 .cell .nm { font-size: 12.5px; color: #3a3935; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v4 .cell .nm .n { color: #9a968e; margin-right: 8px; font-family: var(--mono); font-size: 11px; }
.v4 .cell.on .nm { color: var(--orange); }
.v4 .cell.on .th { box-shadow: 0 0 0 3px var(--orange); }

/* ================= V5 · Channel strips ================= */
.v5 .drawer { background: #d8d4cb; display: grid; grid-template-rows: 214px 1fr; }
.v5 .strips { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); border-bottom: 1px solid #b9b4a8; }
.v5 .strip { border-right: 1px solid #c6c1b6; display: flex; flex-direction: column; align-items: center; padding: 18px 0 14px; gap: 12px; font-family: var(--mono); font-size: 11px; }
.v5 .strip:last-child { border-right: 0; }
.v5 .strip .led { width: 7px; height: 7px; border-radius: 50%; background: #9a968e; }
.v5 .strip.on .led { background: var(--orange); }
.v5 .strip .sw { width: 64px; height: 64px; border-radius: 4px; }
.v5 .strip .cap { width: 34px; height: 34px; border-radius: 3px; background: linear-gradient(#f6f4ef, #dcd8cf); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.v5 .strip.on .cap { background: var(--orange); }
.v5 .strip span { text-align: center; line-height: 1.25; height: 28px; padding: 0 4px; }
.v5 .grid { padding: 20px 32px 24px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 12px; min-height: 0; }
.v5 .cell { position: relative; min-height: 0; border-radius: 3px; overflow: hidden; }
.v5 .cell .th { position: absolute; inset: 0; }
.v5 .cell .nm { position: absolute; left: 0; bottom: 0; background: #111; color: #e9e6df; font-family: var(--mono); font-size: 11px; padding: 4px 8px; }
.v5 .cell.on { outline: 3px solid var(--orange); outline-offset: -3px; }
.v5 .cell.on .nm { background: var(--orange); color: #111; }

/* ================= V6 · Terminal ================= */
.v6 .drawer { background: #0b0b0a; color: #d9d5cc; font-family: var(--mono); display: grid; grid-template-columns: 1fr 340px; }
.v6 .list { padding: 20px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 0 32px; grid-auto-flow: column; grid-template-rows: repeat(16, minmax(0, 1fr)); min-height: 0; }
.v6 .row { display: grid; grid-template-columns: 34px 62px 1fr 48px; align-items: center; gap: 12px; border-bottom: 1px solid #1f1e1c; font-size: 13px; min-height: 0; }
.v6 .row .th { height: 30px; }
.v6 .row .n { color: #6b675f; }
.v6 .row .k { color: #6b675f; text-align: right; font-size: 11px; }
.v6 .row.on { color: var(--orange); }
.v6 .row.on .n, .v6 .row.on .k { color: var(--orange); }
.v6 .side { border-left: 1px solid #23221f; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; }
.v6 .side .h { color: #6b675f; font-size: 11px; margin-bottom: 10px; }
.v6 .side div.f { display: grid; grid-template-columns: 34px 1fr 26px; align-items: center; gap: 12px; font-size: 13px; height: 38px; border-bottom: 1px solid #1f1e1c; }
.v6 .side .sw { width: 26px; height: 18px; }
.v6 .side .key { color: #6b675f; font-size: 11px; text-align: right; }
.v6 .side .f.on { color: var(--orange); }

/* ================= V7 · Monitor wall ================= */
.v7 .drawer { background: #070707; display: grid; grid-template-rows: auto 1fr; }
.v7 .mixer { display: flex; gap: 0; padding: 18px 24px 16px; background: #141414; border-bottom: 1px solid #2a2a2a; }
.v7 .mixer div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; font-family: var(--mono); font-size: 10.5px; color: #9d9a93; }
.v7 .mixer .key { width: 52px; height: 40px; border-radius: 3px; background: #2a2a2a; box-shadow: inset 0 -3px 0 rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
.v7 .mixer .key .sw { width: 36px; height: 24px; border-radius: 2px; }
.v7 .mixer .on .key { background: #8a2a10; box-shadow: inset 0 0 0 2px var(--orange); }
.v7 .mixer .on { color: var(--orange); }
.v7 .wall { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 2px; padding: 2px; min-height: 0; }
.v7 .mon { position: relative; min-height: 0; background: #000; }
.v7 .mon .th { position: absolute; inset: 0; }
.v7 .mon .nm { position: absolute; left: 8px; bottom: 8px; background: #000; color: #e9e6df; font-family: var(--mono); font-size: 11px; padding: 2px 6px; }
.v7 .mon .tally { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #2c2c2c; }
.v7 .mon.on .tally { background: #e51; }
.v7 .mon.on { box-shadow: inset 0 0 0 3px #e51; }
.v7 .mon.on .nm { background: #e51; color: #000; }

/* ================= V8 · Asymmetric editorial ================= */
.v8 .drawer { background: #ece9e2; display: grid; grid-template-columns: 520px 1fr; }
.v8 .lead { padding: 30px 0 30px 40px; display: flex; flex-direction: column; gap: 14px; }
.v8 .lead .th { flex: 1; }
.v8 .lead .ttl { font-size: 34px; font-weight: 500; letter-spacing: -.01em; }
.v8 .lead .fl { font-family: var(--mono); font-size: 13px; color: #8a867e; line-height: 1.9; }
.v8 .lead .fl b { color: var(--orange); font-weight: 500; }
.v8 .lead .fl i { font-style: normal; color: #bdb8ad; margin: 0 7px; }
.v8 .idx { padding: 30px 40px 30px 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(11, minmax(0, 1fr)); grid-auto-flow: column; gap: 0 28px; min-height: 0; }
.v8 .it { display: grid; grid-template-columns: 26px 54px 1fr; gap: 12px; align-items: center; font-size: 14px; border-top: 1px solid #d3cfc6; min-height: 0; }
.v8 .it .th { height: 30px; }
.v8 .it .n { font-family: var(--mono); font-size: 11px; color: #9a968e; }
.v8 .it.on { color: var(--orange); }

/* ================= V9 · Braun index ================= */
.v9 .drawer { background: #e6e3dc; padding: 26px 40px 28px; display: grid; grid-template-rows: auto 1fr; gap: 24px; }
.v9 .fl { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); background: #f3f1ec; border-radius: 10px; padding: 16px 10px 12px; }
.v9 .fl div { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 11.5px; color: #55524c; text-align: center; }
.v9 .fl .b { width: 46px; height: 46px; border-radius: 50%; padding: 5px; background: #e2ded6; box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
.v9 .fl .b .sw { width: 100%; height: 100%; border-radius: 50%; }
.v9 .fl .on .b { background: var(--orange); }
.v9 .fl .on { color: var(--ink); font-weight: 600; }
.v9 .fl span { line-height: 1.2; height: 28px; }
.v9 .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 14px; min-height: 0; }
.v9 .cell { background: #f3f1ec; border-radius: 8px; padding: 7px 7px 0; display: flex; flex-direction: column; min-height: 0; }
.v9 .cell .th { flex: 1; min-height: 0; border-radius: 4px; }
.v9 .cell .nm { font-size: 12px; padding: 7px 3px 8px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.v9 .cell .nm::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #c9c5bb; flex: none; }
.v9 .cell.on .nm::before { background: var(--orange); }
.v9 .cell.on { background: #1e1e1d; color: #fff; }

/* ================= V10 · Film strip ================= */
.v10 .drawer { background: #1a1917; display: grid; grid-template-rows: auto 1fr; }
.v10 .labels { display: flex; gap: 8px; padding: 18px 28px; flex-wrap: nowrap; overflow: hidden; }
.v10 .labels div { flex: 1; height: 46px; background: #efece4; display: grid; grid-template-columns: 8px 1fr; font-family: var(--mono); font-size: 10.5px; color: #222; align-items: center; }
.v10 .labels .sw { height: 100%; }
.v10 .labels span { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v10 .labels .on { background: var(--orange); }
.v10 .strips { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 0 18px; min-height: 0; }
.v10 .strip { background: #0c0c0b; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: 0 28px; position: relative; }
.v10 .strip::before, .v10 .strip::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; background: radial-gradient(circle, #1a1917 2.2px, transparent 2.6px) 0 0 / 16px 9px; }
.v10 .strip::before { top: 3px; } .v10 .strip::after { bottom: 3px; }
.v10 .frames { display: flex; gap: 6px; height: calc(100% - 30px); }
.v10 .fr { flex: 1; position: relative; min-width: 0; }
.v10 .fr .th { position: absolute; inset: 0 0 18px 0; }
.v10 .fr .nm { position: absolute; left: 0; right: 0; bottom: 0; font-family: var(--mono); font-size: 10.5px; color: #8f8b83; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v10 .fr .nm .n { color: #e8a33a; margin-right: 6px; }
.v10 .fr.on .nm { color: var(--orange); }
.v10 .fr.on .th { box-shadow: 0 0 0 3px var(--orange); }

/* ================= V11 / V12 · Video wall ================= */
.wall11 .drawer { background: #000; display: flex; flex-direction: column; }
.wall11 .fl { height: var(--flh); flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-family: var(--mono); font-size: 12px; color: #6f6f6f; }
.wall11 .fl span.on { color: var(--orange); }
.wall11 .tiles { position: relative; display: grid; grid-template-columns: repeat(var(--cols), var(--tile)); grid-auto-rows: var(--tile); gap: 0; margin: 0 auto; }
.wall11 .tile { position: relative; overflow: hidden; }
.wall11 .tile .th { position: absolute; inset: 0; }
.wall11 .tile .nm { position: absolute; left: 0; bottom: 0; padding: 4px 8px; background: #000; color: #fff; font-family: var(--mono); font-size: 11px; opacity: 0; transition: opacity .25s ease; }
.wall11 .tile:hover .nm { opacity: 1; }
.wall11 .tile.on::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--orange); }
.wall11 .x { mix-blend-mode: difference; position: absolute; width: 13px; height: 13px; margin: -6px 0 0 -6px; pointer-events: none; z-index: 2; transition: opacity .25s ease; }
.wall11 .x::before, .wall11 .x::after { content: ""; position: absolute; background: #fff; }
.wall11 .x::before { left: 6px; top: 0; width: 1px; height: 13px; }
.wall11 .x::after { top: 6px; left: 0; height: 1px; width: 13px; }
.v12 .drawer { flex-direction: column-reverse; }
.v12 .x { opacity: 0; }
.v12 .tiles:hover .x { opacity: .9; }

/* ================= V13–V16 · LED wall (cross in every tile) ================= */
.led .drawer { background: #000; display: flex; flex-direction: column; }
.led .fl { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-family: var(--mono); font-size: 12px; color: #6a6a6a; }
.led .fl span.on { color: var(--orange); }
.led .wallbox { flex: 1; min-height: 0; position: relative; }
.led .board { position: absolute; top: 0; }
.led .t { position: absolute; overflow: hidden; background: #000; }
.led .t .th { position: absolute; inset: 0; }
.led .t .nm { position: absolute; left: 0; bottom: 0; padding: 5px 8px 4px; background: #000; color: #fff; font-family: var(--mono); font-size: 11px; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity .3s ease; z-index: 3; }
.led .t:hover .nm { opacity: 1; }
.led .t.art { cursor: pointer; }
.led .x { mix-blend-mode: difference; position: absolute; width: 15px; height: 15px; margin: -7px 0 0 -7px; pointer-events: none; z-index: 2; }
.led .x::before, .led .x::after { content: ""; position: absolute; background: rgba(255,255,255,.92); }
.led .x::before { left: 7px; top: 0; width: 1px; height: 15px; }
.led .x::after { top: 7px; left: 0; height: 1px; width: 15px; }
.led .x.on { mix-blend-mode: normal; }
.led .x.on::before, .led .x.on::after { background: var(--orange); width: 2px; }
.led .x.on::after { width: 15px; height: 2px; }
/* Hover: the name takes the cross's place, the panel takes a slight orange wash. */
.led .t.art .nm { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); padding: 3px 6px 2px; font-size: 10.5px; line-height: 1.35; white-space: normal; width: max-content; max-width: 84%; text-align: center; }
.led .t.art::after { content: ""; position: absolute; inset: 0; background: rgba(255, 90, 31, .22); opacity: 0; transition: opacity .3s ease; z-index: 1; pointer-events: none; }
.led .t.art:hover::after { opacity: 1; }
.led .t.art .x { transition: opacity .3s ease; }
.led .t.art:hover .x { opacity: 0; }
.led .t.fx .fnm { position: absolute; left: 8px; bottom: 6px; font-family: var(--mono); font-size: 10.5px; color: #8a8a8a; text-transform: uppercase; letter-spacing: .02em; }
.led .t.fx.on .fnm { color: var(--orange); }
.led .t.fx { cursor: pointer; border-right: 1px solid #111; }
.led .t.fx:hover .fnm { color: #fff; }

@media (max-width: 700px) { .tag { font-size: 13px; } }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
const FILTERS = ['Off', 'Scanlines', 'Circle Sampling', 'Static Noise', 'Chromatic Aberration', 'VHS Tracking', 'Posterize', 'Pixelate', 'Color Invert', 'LED Grid', 'Dither', 'Glitch', 'Black & White'];
const SHORT = { 'Chromatic Aberration': 'Chromatic', 'Circle Sampling': 'Circles', 'Black & White': 'B&W', 'VHS Tracking': 'VHS', 'Static Noise': 'Noise', 'Color Invert': 'Invert' };
const ART = [
  ['giphy', 'Giphy Feed'], ['trail', 'Mechanical'], ['twirlz', 'Twirlz'], ['bugs3', 'Bugs3'], ['rising_triangles', 'Rising Triangles'], ['particle_machine', 'Particle Machine'], ['delayed_lerp_points8', 'Delayed Lerp Points 8'], ['delayed_lerp_points7b', 'Delayed Lerp Points 7b'],
  ['blocks', 'Generative Blocks'], ['isocubes', 'Isocubes'], ['bubbles', 'Bubbles'], ['particle_drawings', 'Particle Drawings'], ['pulsing_squares', 'Pulsing Squares'], ['four_dots', 'Four Dots'], ['patterns2', 'Patterns 2'], ['led_grid', 'LED Grid'],
  ['grid', 'Grid'], ['bouncy', 'Bouncy'], ['branches', 'Branches'], ['word_sparks', 'Word Sparks'], ['eyes', 'Eyes'], ['delayed_lerp_points7', 'Delayed Lerp Points 7'], ['self_avoiding_walk_3d', 'Self Avoiding Walk 3D'], ['sound_investigation1', 'Sound Investigation 1'],
  ['sound_investigation2', 'Sound Investigation 2'], ['wall_drawing_26', 'Wall Drawing No. 26'], ['cubes_token_sha', 'Cubes Token SHA'], ['bonk', 'Bonk'], ['delayed_lerp_points2c', 'Delayed Lerp Points 2C'], ['delayed_lerp_points_1600', 'Delayed Lerp Points 1600'], ['bios_webcam', 'BIOS Webcam'], ['prelinger_broll', 'Prelinger B-roll'],
  ['system_terminal', 'System Terminal'], ['error_404', 'Error 404'], ['swiss_clock', 'Swiss Clock'], ['passbook_cam', 'Passbook Cam'], ['glyph_board', 'Glyph Board'], ['ascii_rest', 'ASCII Rest'],
];
const ON_ART = 'eyes', ON_F = 10;
const th = (id) => `<div class="th" style="background-image:url(../visuals/thumbs/${id}.jpg)"></div>`;
const sw = (i) => `<div class="sw" data-f="${i}"></div>`;
const pad = (n) => String(n).padStart(2, '0');
const short = (n) => SHORT[n] || n;
const on = (c) => c ? ' on' : '';

// Per-version seeds: sha256 of "12855g-N"; first 16 hex chars.
const SEEDS = ['9f15091919c2d08d', '7ebcce09e89ec7f6', '16ae0532e4aa2320', 'f5667dc7e37bd049', '9c94d8c4a01b625c', 'ff5f5a867a97b7af', '8557a943d60626d9', 'b02ed37b64d75685', 'dfea63dc2ec02772', '94dd92ec74490e1b', '3c1e0d9b7a5f2e48', '61b0f2c94d8a7e15', 'a41f7c2e9b03d658', '2e9d40b7c15a83f6', 'c7305e8a1fd942b0', '58b2e1f04a9c7d36'];

const DECK = `<div class="deck"><div class="spk"></div><div class="btns"><div class="btn ej"></div><div class="btn on"></div><div class="btn"></div><div class="btn"></div></div>
<div class="disp"><div><div class="row"><span class="k">SONG</span><span class="song">Neon Rift</span></div><div class="row"><span class="k">ARTIST</span><span>Waveform Decay</span></div></div>
<div><div class="row"><span class="k">ART</span><span>Eyes · Dither</span></div><div class="row"><span class="k">SHOW</span><span>MONOCHROME DISCO</span></div></div>
<div class="eq">${[48,30,22,16,18,20,20,18,16,15,14,18,22,19,16,18,15,17,14,16,15,13].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div>
<div class="knobs">${['CUTOFF','RESONANCE','ALPHA','SENSITIVITY','SLOT','SAVE'].map(k=>`<div class="knob"><span></span>${k}</div>`).join('')}</div></div>`;

const V = [];

V.push(['Teletext index', 'The drawer becomes a teletext page: numbered filters and numbered artworks, picked like page numbers.', () => `
<div class="bar"><span class="p">P300</span><span>DEAD INTERNET RADIO</span><span class="y">VISUALS</span></div>
<div class="fl">${FILTERS.map((f, i) => `<div class="${on(i === ON_F)}"><span class="n">${300 + i}</span>${f.toUpperCase()}</div>`).join('')}</div>
<div class="grid">${ART.map(([id, n], i) => `<div class="cell${on(id === ON_ART)}">${th(id)}<div class="nm"><span class="n">${320 + i}</span>${n.toUpperCase()}</div></div>`).join('')}</div>`]);

V.push(['Contact sheet', 'A light-table contact sheet: frame numbers under every still, the live one ringed in grease pencil.', () => `
<div class="fl">${FILTERS.map((f, i) => `<div class="${on(i === ON_F)}">${sw(i)}<span>${short(f)}</span></div>`).join('')}</div>
<div class="sheet">${ART.map(([id, n], i) => `<div class="cell${on(id === ON_ART)}">${th(id)}<div class="nm"><span>${n}</span><span class="n">${pad(i + 1)}A</span></div></div>`).join('')}</div>`]);

V.push(['Tape library', 'Filters are cassette spines down the side; artworks are boxed tapes on the shelf.', () => `
<div class="spines">${FILTERS.map((f, i) => `<div class="spine${on(i === ON_F)}">${sw(i)}<span>${f}</span></div>`).join('')}</div>
<div class="shelf">${ART.map(([id, n]) => `<div class="cell${on(id === ON_ART)}">${th(id)}<div class="nm">${n}</div></div>`).join('')}</div>`]);

V.push(['Museum labels', 'Gallery wall: quiet filter list with colour dots, every artwork captioned below its image, never on it.', () => `
<div class="fl">${FILTERS.map((f, i) => `<div class="${on(i === ON_F)}">${sw(i)}${f}</div>`).join('')}</div>
<div class="grid">${ART.map(([id, n], i) => `<div class="cell${on(id === ON_ART)}">${th(id)}<div class="nm"><span class="n">${pad(i + 1)}</span>${n}</div></div>`).join('')}</div>`]);

V.push(['Channel strips', 'Filters are mixing-desk channels with a lamp and a key; artworks sit underneath as a tight bank.', () => `
<div class="strips">${FILTERS.map((f, i) => `<div class="strip${on(i === ON_F)}"><div class="led"></div>${sw(i)}<div class="cap"></div><span>${short(f)}</span></div>`).join('')}</div>
<div class="grid">${ART.map(([id, n]) => `<div class="cell${on(id === ON_ART)}">${th(id)}<div class="nm">${n}</div></div>`).join('')}</div>`]);

V.push(['Terminal', 'A dense trading-terminal listing: two columns of artworks, filters keyed F1–F12 down the right.', () => `
<div class="list">${ART.map(([id, n], i) => `<div class="row${on(id === ON_ART)}"><span class="n">${pad(i + 1)}</span>${th(id)}<span>${n}</span><span class="k">${id === ON_ART ? 'LIVE' : ''}</span></div>`).join('')}</div>
<div class="side"><div class="h">FILTER</div>${FILTERS.map((f, i) => `<div class="f${on(i === ON_F)}">${sw(i)}<span>${f}</span><span class="key">${i ? 'F' + i : 'ESC'}</span></div>`).join('')}</div>`]);

V.push(['Monitor wall', 'A broadcast gallery: vision-mixer keys for filters, a wall of monitors with a red tally on air.', () => `
<div class="mixer">${FILTERS.map((f, i) => `<div class="${on(i === ON_F)}"><div class="key">${sw(i)}</div>${short(f)}</div>`).join('')}</div>
<div class="wall">${ART.map(([id, n]) => `<div class="mon${on(id === ON_ART)}">${th(id)}<span class="tally"></span><span class="nm">${n}</span></div>`).join('')}</div>`]);

V.push(['Editorial', 'Radical asymmetry: the live artwork large on the left, everything else an index you read like a magazine contents page.', () => `
<div class="lead">${th(ON_ART)}<div class="ttl">Eyes</div><div class="fl">${FILTERS.map((f, i) => i === ON_F ? `<b>${f}</b>` : f).join('<i>/</i>')}</div></div>
<div class="idx">${ART.filter(a => a[0] !== ON_ART).slice(0, 33).map(([id, n], i) => `<div class="it">${`<span class="n">${pad(i + 1)}</span>`}${th(id)}<span>${n}</span></div>`).join('')}</div>`]);

V.push(['Braun index', 'Rams restraint: round filter keys with the name below, artworks on soft cards with a status dot.', () => `
<div class="fl">${FILTERS.map((f, i) => `<div class="${on(i === ON_F)}"><div class="b">${sw(i)}</div><span>${short(f)}</span></div>`).join('')}</div>
<div class="grid">${ART.map(([id, n]) => `<div class="cell${on(id === ON_ART)}">${th(id)}<div class="nm">${n}</div></div>`).join('')}</div>`]);

V.push(['Film strip', 'Three reels of 35mm film run across the drawer; filters are labelled cans of tape above.', () => `
<div class="labels">${FILTERS.map((f, i) => `<div class="${on(i === ON_F)}">${sw(i)}<span>${short(f)}</span></div>`).join('')}</div>
<div class="strips">${[0, 1, 2].map(r => `<div class="strip"><div class="frames">${ART.slice(r * 12, r * 12 + 12).map(([id, n], i) => `<div class="fr${on(id === ON_ART)}">${th(id)}<div class="nm"><span class="n">${pad(r * 12 + i + 1)}</span>${n}</div></div>`).join('')}</div></div>`).join('')}</div>`]);

const frameH = () => new URLSearchParams(location.search).get('v') ? Math.round(1440 * innerHeight / innerWidth) : 900;
// Video wall: square tiles, no gaps, sized so every artwork fits the drawer.
function wall() {
  const W = 1440, H = frameH() - 128, FLH = 48, n = ART.length;
  let best = { size: 0 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), size = Math.min(W / c, (H - FLH) / r);
    if (size > best.size) best = { cols: c, rows: r, size };
  }
  const { cols, rows, size } = best;
  const xs = [];
  for (let r = 1; r < rows; r++) for (let c = 1; c < cols; c++) xs.push(`<i class="x" style="left:${c * size}px;top:${r * size}px"></i>`);
  return `<div class="fl" style="--flh:${H - rows * size}px">${FILTERS.map((f, i) => `<span class="${on(i === ON_F)}">${f}</span>`).join('')}</div>
<div class="tiles" style="--cols:${cols};--tile:${size}px">${ART.map(([id, n]) => `<div class="tile${on(id === ON_ART)}">${th(id)}<span class="nm">${n}</span></div>`).join('')}${xs.join('')}</div>`;
}
V.push(['Video wall', 'An LED video wall: square tiles with no gaps, a thin cross at every seam, the filters one quiet line above.', wall]);
V.push(['Video wall, quiet', 'The same wall with the crosses only under the pointer and the filters along the bottom.', wall]);

// ── LED walls: a cross in the middle of every panel, black panels between. ──
function rng(seed) {
  let a = parseInt(seed.slice(0, 8), 16) >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const shuffle = (arr, r) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const filterLine = () => `<div class="fl">${FILTERS.map((f, i) => `<span class="${on(i === ON_F)}">${f}</span>`).join('')}</div>`;
// tiles: [{x, y, w, h, id?, name?, fx?}] in panel units; crosses at every panel centre.
function board(tiles, size, cols, top = 0) {
  const W = 1440;
  const left = Math.round((W - cols * size) / 2);
  const out = tiles.map((t) => {
    const style = `left:${t.x * size}px;top:${t.y * size}px;width:${t.w * size}px;height:${t.h * size}px`;
    const xs = [];
    for (let i = 0; i < t.w; i++) for (let j = 0; j < t.h; j++) xs.push(`<i class="x${t.onX ? ' on' : ''}" style="left:${(i + 0.5) * size}px;top:${(j + 0.5) * size}px"></i>`);
    if (t.fx != null) return `<div class="t fx${on(t.fx === ON_F)}" style="${style}"><span class="fnm">${short(FILTERS[t.fx])}</span>${xs.join('')}</div>`;
    if (!t.id) return `<div class="t" style="${style}">${xs.join('')}</div>`;
    return `<div class="t art" style="${style}">${th(t.id)}<span class="nm">${t.name}</span>${xs.join('')}</div>`;
  });
  return `<div class="wallbox"><div class="board" style="left:${left}px;top:${top}px;width:${cols * size}px">${out.join('')}</div></div>`;
}
const wallH = () => frameH() - 128 - 40;

// V13: half-tile column offsets, a few 2×2 panels, about a quarter black.
function ledWall() {
  const r = rng(SEEDS[12]);
  const H = wallH(), n = ART.length;
  for (let size = 150; size > 60; size -= 2) {
    const cols = Math.floor(1440 / size);
    const off = Array.from({ length: cols }, (_, c) => (c % 4 === 1 || c % 4 === 2) && c !== cols - 1 ? 0.5 : 0);
    // Pairs of neighbouring columns share an offset, so 2×2 panels fit there.
    const rowsOf = (c) => Math.floor((H - off[c] * size) / size);
    const used = new Set(), tiles = [];
    const spans = [];
    for (let k = 0; k < 3; k++) {
      for (let tries = 0; tries < 40; tries++) {
        const c = Math.floor(r() * (cols - 1));
        if (off[c] !== off[c + 1]) continue;
        const rr = Math.floor(r() * (Math.min(rowsOf(c), rowsOf(c + 1)) - 1));
        const keys = [[c, rr], [c + 1, rr], [c, rr + 1], [c + 1, rr + 1]].map(([a, b]) => a + ':' + b);
        if (keys.some((q) => used.has(q))) continue;
        keys.forEach((q) => used.add(q));
        spans.push({ x: c, y: rr + off[c], w: 2, h: 2 });
        break;
      }
    }
    const free = [];
    for (let c = 0; c < cols; c++) for (let rr = 0; rr < rowsOf(c); rr++) if (!used.has(c + ':' + rr)) free.push({ x: c, y: rr + off[c], w: 1, h: 1 });
    const singles = n - spans.length;
    if (free.length < singles / 0.72) continue;
    const art = shuffle(ART.slice(), r);
    spans.forEach((t, i) => Object.assign(t, { id: art[i][0], name: art[i][1] }));
    const pick = shuffle(free.map((_, i) => i), r).slice(0, singles).sort((a, b) => a - b);
    pick.forEach((fi, k) => Object.assign(free[fi], { id: art[spans.length + k][0], name: art[spans.length + k][1] }));
    return filterLine() + board([...free, ...spans], size, cols);
  }
}

// V14: strict grid in order; the playing artwork's cross turns orange.
function ledBank() {
  const H = wallH(), n = ART.length;
  let best = { size: 0 };
  for (let c = 1; c <= n; c++) {
    const rows = Math.ceil(n / c), size = Math.floor(Math.min(1440 / c, H / rows));
    if (size > best.size) best = { cols: c, rows, size };
  }
  const { cols, rows, size } = best;
  const tiles = [];
  for (let i = 0; i < cols * rows; i++) {
    const a = ART[i];
    tiles.push({ x: i % cols, y: Math.floor(i / cols), w: 1, h: 1, id: a?.[0], name: a?.[1], onX: a && a[0] === ON_ART });
  }
  return filterLine() + board(tiles, size, cols);
}

// V15: more black than art, like lit windows at night.
function ledSparse() {
  const r = rng(SEEDS[14]);
  const H = wallH(), n = ART.length;
  let best = { size: 0 };
  for (let c = 1; c <= n * 2; c++) {
    const rows = Math.ceil((n * 2) / c), size = Math.floor(Math.min(1440 / c, H / rows));
    if (size > best.size) best = { cols: c, rows, size };
  }
  const { cols, rows, size } = best;
  const slots = shuffle([...Array(cols * rows).keys()], r).slice(0, n).sort((a, b) => a - b);
  const tiles = [...Array(cols * rows).keys()].map((i) => ({ x: i % cols, y: Math.floor(i / cols), w: 1, h: 1 }));
  slots.forEach((s, k) => Object.assign(tiles[s], { id: ART[k][0], name: ART[k][1] }));
  return filterLine() + board(tiles, size, cols);
}

// V16: the filters are panels too, the wall's first row.
function ledFilters() {
  const r = rng(SEEDS[15]);
  const H = frameH() - 128, n = ART.length, cols = FILTERS.length;
  const size = Math.floor(1440 / cols);
  const rows = Math.floor(H / size);
  const tiles = FILTERS.map((_, i) => ({ x: i, y: 0, w: 1, h: 1, fx: i }));
  const slots = [...Array(cols * (rows - 1)).keys()];
  const pick = shuffle(slots.slice(), r).slice(0, n).sort((a, b) => a - b);
  const art = new Map(pick.map((s, k) => [s, ART[k]]));
  slots.forEach((s) => { const a = art.get(s); tiles.push({ x: s % cols, y: 1 + Math.floor(s / cols), w: 1, h: 1, id: a?.[0], name: a?.[1] }); });
  return board(tiles, size, cols, Math.floor((H - rows * size) / 2));
}
V.push(['Wall', 'Closest to the photographed LED wall: some columns dropped half a panel, a few artworks across four panels, black panels between.', ledWall]);
V.push(['Monitor bank', 'A strict bank of panels in order; the playing artwork is marked only by its cross turning orange.', ledBank]);
V.push(['Sparse', 'More dark panels than lit ones, like windows at night; the name appears under the cross.', ledSparse]);
V.push(['Wall with filters', 'The filters are panels in the same wall, the first row, named small in the corner.', ledFilters]);

const only = new URLSearchParams(location.search).get('v');
const page = document.getElementById('page');
V.forEach(([name, line, body], i) => {
  const n = i + 1;
  if (only && Number(only) !== n) return;
  const s = SEEDS[i];
  // Seed-derived tuning: gap and a tiny type-scale nudge per version.
  const gapNudge = parseInt(s[2], 16) % 4;
  const typeNudge = 1 + (parseInt(s[3], 16) % 5) / 100;
  page.insertAdjacentHTML('beforeend', `<section class="ver"><div class="tag"><b>V${n} · ${name}.</b> ${line}</div>
    <div class="scaler" style="aspect-ratio:1440/${frameH()}"><div class="frame v${n}${n === 11 || n === 12 ? ' wall11' : n > 12 ? ' led' : ''}" style="height:${frameH()}px;--gn:${gapNudge}px;font-size:${typeNudge}em">${DECK}<div class="drawer">${body()}</div></div></div></section>`);
});
if (only) document.body.classList.add('solo');
function fit() { document.querySelectorAll('.scaler').forEach(sc => { sc.firstElementChild.style.transform = `scale(${sc.clientWidth / 1440})`; }); }
addEventListener('resize', fit); fit();
</script>
</body>
</html>
