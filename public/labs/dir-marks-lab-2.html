<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIR Marks II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #0e0e0d; --ink: #ece8df; --dim: #9a958c; --frame: #191918; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 'Plus Jakarta Sans', sans-serif; }
header, section { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 64px; padding-bottom: 48px; }
h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: 0; }
header p { margin: 0; color: var(--dim); max-width: 640px; }
section { margin-bottom: 80px; }
.tag { margin: 0 0 16px; max-width: 760px; }
.tag b { font-weight: 700; }
.frame { background: var(--frame); padding: 12px; border-radius: 6px; }
.stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body.solo header, body.solo .tag { display: none; }
body.solo section { max-width: none; padding: 0; margin: 0; }
body.solo .frame { padding: 0; border-radius: 0; }
</style>
</head>
<body>
<header>
  <h1>DIR marks II</h1>
  <p>Ten marks for Dead Internet Radio, none of them a restyle of the forty-two already tried. Each runs on its own seed string: palette steps, layout grid and type scale come out of the hex. The band under every mark shows it at 36px on the deck cream and on black.</p>
</header>
<main id="lab"></main>
<script>
'use strict';
const ORANGE = '#ff5a1f', CREAM = '#f2eee6', INK = '#0b0b0a', DECK = '#d9d4ca';
const PI = Math.PI;
const SANS = "'Plus Jakarta Sans', sans-serif", MONO = "'IBM Plex Mono', monospace", SERIF = "'Instrument Serif', serif";

function rng(hex) {
  let a = parseInt(hex.slice(0, 8), 16) >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; }
function font(ctx, px, wt, fam) { ctx.font = `${wt} ${px}px ${fam}`; }
function capFor(ctx, cap, wt, fam) { font(ctx, 100, wt, fam); const a = ctx.measureText('D').actualBoundingBoxAscent || 72; const px = cap * 100 / a; font(ctx, px, wt, fam); return px; }
function tw(ctx, s) { return ctx.measureText(s).width; }
function hair(c) { return Math.max(.006, 1.1 / c.px); }

function palette(S, light) {
  const r = S.r;
  S.n = 3 + Math.floor(r() * 3);
  S.gx = 5 + Math.floor(r() * 5);
  S.ts = .9 + r() * .2;
  if (light) {
    S.ground = mix(CREAM, DECK, .2 + r() * .65);
    S.ink = mix(INK, '#2a2018', r() * .7);
  } else {
    S.ground = mix('#0d0d0c', '#221d18', .25 + r() * .75);
    S.ink = mix(CREAM, '#ffffff', r() * .4);
  }
  S.dim = mix(S.ink, S.ground, .36);
  S.steps = Array.from({ length: Math.max(3, S.n) }, (_, i) => mix(S.ground, S.ink, .08 + i * (.88 / (Math.max(3, S.n) - 1))));
  S.big = .56 + r() * .10;
}

function arcText(ctx, text, r, mid, dir, cap, wt, fam, color, upright) {
  const px = capFor(ctx, cap, wt, fam), chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width + px * .04);
  const total = widths.reduce((a, b) => a + b, 0);
  let a = mid - dir * total / (2 * r);
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  chars.forEach((ch, i) => {
    const adv = widths[i] / r, ang = a + dir * adv / 2;
    ctx.save(); ctx.translate(Math.cos(ang) * r, Math.sin(ang) * r); ctx.rotate(ang + PI / 2 + (upright ? PI : 0));
    ctx.fillText(ch, 0, 0); ctx.restore();
    a += dir * adv;
  });
  ctx.textAlign = 'left';
}

const V = [
  {
    seed: 'b7a6a80af3ee1a4b4e1df73de884819785739d21a6363a89',
    name: 'Postmark',
    idea: 'A cancellation stamp for a station with no return address: the name runs the rim, the frequency sits in an orange slug, and the killer bars run off the edge.',
    light: true,
    init(S) {
      palette(S, true);
      S.bars = 4 + Math.floor(S.r() * 2);
      S.slug = .28 + S.r() * .06;
      S.big = .62 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const R = .5, ink = c.ink, lw = hair(c);
      ctx.save(); ctx.translate(.5, .5);
      ctx.strokeStyle = ink; ctx.lineWidth = .026; ctx.beginPath(); ctx.arc(0, 0, .487, 0, 2 * PI); ctx.stroke();
      ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(0, 0, .424, 0, 2 * PI); ctx.stroke();
      arcText(ctx, 'DEAD INTERNET RADIO', .430, -PI / 2, 1, .025, 700, SANS, ink);
      arcText(ctx, '88.8 MHz · NO CARRIER', .452, PI / 2, -1, .021, 500, MONO, ink, true);
      font(ctx, capFor(ctx, .148, 500, MONO), 500, MONO);
      ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('D.I.R.', 0, .052);
      const sy = .125, sh = .064;
      ctx.fillStyle = c.accent; ctx.beginPath(); ctx.roundRect(-S.slug / 2, sy, S.slug, sh, .008); ctx.fill();
      font(ctx, capFor(ctx, .038, 500, MONO), 500, MONO);
      ctx.fillStyle = INK; ctx.fillText('88.8', 0, sy + sh - .017);
      ctx.restore();
      ctx.strokeStyle = ink; ctx.lineWidth = .017; ctx.lineCap = 'butt';
      const top = .5 - (S.bars - 1) * .064 / 2;
      for (let i = 0; i < S.bars; i++) {
        const y = top + i * .064;
        ctx.beginPath();
        for (let x = .985; x <= 2.0; x += .01) {
          const yy = y + Math.sin((x - .985) / .20 * PI * 2) * .008;
          x === .985 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      return 2.02;
    },
  },
  {
    seed: '3fdcd76a3bfdaa59f2c28d3a0d07e9103a179dc6e7390ea9',
    name: 'Running lights',
    idea: 'A vessel still showing its masthead and sidelights at night with nobody aboard: three lamps on a mast, the call sign set beside them.',
    init(S) {
      palette(S, false);
      S.mast = .24 + S.r() * .08;
      S.lamp = .05 + S.r() * .01;
      S.big = .64 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const ink = c.ink, m = S.mast, lw = Math.max(.016, 2.4 / c.px);
      ctx.lineCap = 'butt';
      ctx.strokeStyle = rgba(ink, .2); ctx.lineWidth = Math.max(.01, 1.4 / c.px);
      ctx.beginPath(); ctx.moveTo(m - .30, .78); ctx.lineTo(m + .30, .78); ctx.stroke();
      ctx.strokeStyle = rgba(ink, .62); ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(m, .14); ctx.lineTo(m, .78); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(m - .15, .44); ctx.lineTo(m + .15, .44); ctx.stroke();
      const lamp = (x, y, col, r) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill(); };
      lamp(m, .14, c.accent, S.lamp);
      lamp(m - .15, .44, '#c2453a', S.lamp * .9);
      lamp(m + .15, .44, '#3f8f63', S.lamp * .9);
      const x = m + .28;
      font(ctx, capFor(ctx, .05, 700, SANS), 700, SANS);
      ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillText('DEAD INTERNET RADIO', x, .465);
      font(ctx, capFor(ctx, .03, 500, MONO), 500, MONO);
      ctx.fillStyle = c.accent; ctx.fillText('88.8 MHz', x, .545);
      font(ctx, capFor(ctx, .05, 700, SANS), 700, SANS);
      return x + tw(ctx, 'DEAD INTERNET RADIO') + .04;
    },
  },
  {
    seed: '598e754f90288d123a1f27c09c37ccd0901efd21793b49b3',
    name: 'Schematic',
    idea: 'The signal drawn as a circuit: it enters at the aerial, passes through the letters as a labelled bus, and ends at earth.',
    init(S) {
      palette(S, false);
      S.earth = 3 + Math.floor(S.r() * 2);
      S.big = .58 + S.r() * .05;
    },
    draw(ctx, c, S, small) {
      const ink = c.ink, lw = Math.max(.012, 1.4 / c.px), x0 = .12, y = .72;
      ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
      ctx.beginPath();
      ctx.moveTo(x0, .115); ctx.lineTo(x0 - .045, .175); ctx.moveTo(x0, .115); ctx.lineTo(x0 + .045, .175);
      ctx.moveTo(x0, .115); ctx.lineTo(x0, y);
      ctx.stroke();
      const cap = .21;
      font(ctx, capFor(ctx, cap, 500, MONO), 500, MONO);
      const word = 'DIR', ww = tw(ctx, word), xw = x0 + .22;
      ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic'; ctx.fillText(word, xw, y + cap / 2);
      ctx.strokeStyle = ink; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(xw - .008, y); ctx.stroke();
      const x2 = xw + ww + .24;
      ctx.beginPath(); ctx.moveTo(xw + ww + .008, y); ctx.lineTo(x2, y); ctx.lineTo(x2, .83); ctx.stroke();
      for (let i = 0; i < S.earth; i++) {
        const w = .14 - i * (.095 / Math.max(1, S.earth - 1));
        ctx.beginPath(); ctx.moveTo(x2 - w / 2, .835 + i * .031); ctx.lineTo(x2 + w / 2, .835 + i * .031); ctx.stroke();
      }
      ctx.fillStyle = c.accent; ctx.beginPath(); ctx.arc(x0, y, .019, 0, 2 * PI); ctx.fill();
      if (!small) {
        font(ctx, capFor(ctx, .034, 500, MONO), 500, MONO); ctx.fillStyle = S.dim;
        ctx.textAlign = 'right'; ctx.fillText('ANT', x0 - .065, .315);
        ctx.textAlign = 'center'; ctx.fillText('GND', x2, .975);
        ctx.textAlign = 'left'; ctx.fillText('88.8 MHz', xw, .60);
      }
      return x2 + .07;
    },
  },
  {
    seed: '3c6e5e6b959ec407c743f6d51b8ba02a2619369591afd76c',
    name: 'Fermata',
    idea: 'A whole bar of silence with a fermata over it: hold this rest indefinitely, the dot the only thing still live.',
    light: true,
    init(S) {
      palette(S, true);
      S.len = 2.05 + S.r() * .25;
      S.big = .56 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const ink = c.ink, W = S.len, lw = Math.max(.008, 1.2 / c.px);
      ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.lineCap = 'butt';
      const ys = [.20, .325, .45, .575, .70];
      ys.forEach(y => { ctx.beginPath(); ctx.moveTo(.045, y); ctx.lineTo(W - .045, y); ctx.stroke(); });
      ctx.lineWidth = Math.max(.011, 1.35 / c.px);
      ctx.beginPath(); ctx.moveTo(W - .045, .20); ctx.lineTo(W - .045, .70); ctx.stroke();
      const cx = W * .5;
      ctx.save(); ctx.translate(cx, .45); ctx.rotate(-.22);
      ctx.fillStyle = c.ground; ctx.beginPath(); ctx.ellipse(0, 0, .082, .056, 0, 0, 2 * PI); ctx.fill();
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.014, 1.8 / c.px);
      ctx.beginPath(); ctx.ellipse(0, 0, .082, .056, 0, 0, 2 * PI); ctx.stroke();
      ctx.restore();
      ctx.lineWidth = Math.max(.013, 1.7 / c.px);
      ctx.beginPath(); ctx.arc(cx, .150, .092, PI, 2 * PI); ctx.stroke();
      ctx.fillStyle = c.accent; ctx.beginPath(); ctx.arc(cx, .150, .021, 0, 2 * PI); ctx.fill();
      const nx = .065, ny = .10;
      ctx.save(); ctx.translate(nx, ny); ctx.rotate(-.32);
      ctx.fillStyle = ink; ctx.beginPath(); ctx.ellipse(0, 0, .022, .014, 0, 0, 2 * PI); ctx.fill(); ctx.restore();
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.008, 1.1 / c.px);
      ctx.beginPath(); ctx.moveTo(nx + .019, ny + .004); ctx.lineTo(nx + .019, ny - .062); ctx.stroke();
      font(ctx, capFor(ctx, .042, 500, MONO), 500, MONO);
      ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillText('= 88.8', nx + .055, ny + .006);
      font(ctx, capFor(ctx, .075, 400, SERIF), 400, SERIF);
      ctx.fillText('Dead Internet Radio', .045, .915);
      if (!small) {
        font(ctx, capFor(ctx, .032, 500, MONO), 500, MONO); ctx.fillStyle = S.dim;
        ctx.textAlign = 'right'; ctx.fillText('88.8 MHz', W - .045, .915); ctx.textAlign = 'left';
      }
      return W;
    },
  },
  {
    seed: '47efd42ab097136fd63f2cf587087378af8da0e24cd3fe00',
    name: 'Blazon',
    idea: 'The arms of a dead broadcaster: a shield of three wavy bars, a mast for a crest, and the motto SILENTIUM PERPETUUM.',
    init(S) {
      palette(S, false);
      S.big = .68 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const ink = c.ink, cx = .5, lw = Math.max(.01, 1.4 / c.px);
      const x1 = cx - .25, x2 = cx + .25, yt = .24, ys = .58, yb = .86;
      const sp = new Path2D();
      sp.moveTo(x1, yt); sp.lineTo(x2, yt); sp.lineTo(x2, ys);
      sp.bezierCurveTo(x2, .72, cx + .10, .82, cx, yb);
      sp.bezierCurveTo(cx - .10, .82, x1, .72, x1, ys); sp.closePath();
      ctx.fillStyle = mix(S.ground, ink, .08); ctx.fill(sp);
      ctx.save(); ctx.clip(sp);
      for (let i = 0; i < 3; i++) {
        const y = .585 + i * .075, th = .034, amp = .0072;
        ctx.fillStyle = i === 1 ? c.accent : ink;
        ctx.beginPath();
        for (let x = x1 - .02; x <= x2 + .02; x += .004) {
          const yy = y - th / 2 + Math.sin((x - x1) / .095 * 2 * PI) * amp;
          x === x1 - .02 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
        }
        for (let x = x2 + .02; x >= x1 - .02; x -= .004) {
          const yy = y + th / 2 + Math.sin((x - x1) / .095 * 2 * PI) * amp;
          ctx.lineTo(x, yy);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = ink; ctx.lineWidth = lw * 1.8; ctx.stroke(sp);
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.01, 1.25 / c.px);
      ctx.beginPath();
      ctx.moveTo(cx, .055); ctx.lineTo(cx - .07, .16); ctx.moveTo(cx, .055); ctx.lineTo(cx + .07, .16);
      ctx.moveTo(cx, .055); ctx.lineTo(cx, yt); ctx.stroke();
      ctx.fillStyle = c.accent;
      ctx.beginPath(); ctx.moveTo(cx, .052); ctx.lineTo(cx + .085, .085); ctx.lineTo(cx, .118); ctx.closePath(); ctx.fill();
      font(ctx, capFor(ctx, .14, 400, SERIF), 400, SERIF);
      ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('D.I.R.', cx, .50);
      const rx0 = .19, rx1 = .81, ry0 = .895, ry1 = .948, tw2 = .028, ym = (ry0 + ry1) / 2;
      ctx.fillStyle = c.accent;
      ctx.beginPath();
      ctx.moveTo(rx0, ry0); ctx.lineTo(rx1, ry0); ctx.lineTo(rx1 - tw2, ym); ctx.lineTo(rx1, ry1);
      ctx.lineTo(rx0, ry1); ctx.lineTo(rx0 + tw2, ym); ctx.closePath(); ctx.fill();
      font(ctx, capFor(ctx, .029, 500, MONO), 500, MONO);
      ctx.fillStyle = INK; ctx.fillText('SILENTIUM PERPETUUM', cx, .928);
      return .95;
    },
  },
  {
    seed: '59e50696e7ff800658305dca7c45227e8aa8d512ca54eb44',
    name: 'Punched tape',
    idea: 'The call sign punched in five-bit ITA2: a paper tape with its sprocket holes, D, I and R decoded above the columns.',
    init(S) {
      palette(S, false);
      S.pitch = .24 + S.r() * .03;
      S.big = .56 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const ink = c.ink, lw = Math.max(.007, 1.2 / c.px);
      const codes = [['LTRS', [1, 1, 1, 1, 1]], ['D', [0, 1, 0, 0, 1]], ['I', [0, 0, 1, 1, 0]], ['R', [0, 1, 0, 1, 0]]];
      const p = S.pitch, x0 = .10, W = 1.86, top = .37, bot = .80, mid = .585;
      ctx.fillStyle = mix(CREAM, DECK, .3); ctx.beginPath(); ctx.roundRect(x0 - .06, top, W - x0 - .04, bot - top, .006); ctx.fill();
      ctx.strokeStyle = rgba(ink, .2); ctx.lineWidth = lw; ctx.stroke();
      const hole = (x, y, r) => { ctx.fillStyle = c.ground; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill(); };
      for (let x = x0 - .03; x < W - .055; x += .076) hole(x, mid, .0105);
      const rows = [.415, .475, .635, .695, .755];
      codes.forEach(([ch, bits], i) => {
        const x = x0 + .185 + i * p;
        bits.forEach((b, j) => { if (b) hole(x, rows[j], .0175); });
        const ltrs = ch === 'LTRS';
        font(ctx, capFor(ctx, ltrs ? .03 : .095, 500, MONO), 500, MONO);
        ctx.fillStyle = ch === 'I' ? c.accent : ltrs ? S.dim : ink;
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(ch, x, .362);
      });
      if (!small) {
        font(ctx, capFor(ctx, .034, 500, MONO), 500, MONO);
        ctx.fillStyle = S.dim; ctx.textAlign = 'left';
        ctx.fillText('ITA2 · 5-BIT · 88.8 MHz', x0 - .06, .905);
      }
      return W;
    },
  },
  {
    seed: '5df6b3b6e9efba9d28388ea8350dd5bcde90e7b403ce21eb',
    name: 'Slide',
    idea: 'The last slide in the carousel: a 35mm mount, hand-numbered, with the mark projected in the aperture.',
    init(S) {
      palette(S, false);
      S.mount = mix(CREAM, DECK, .25 + S.r() * .35);
      S.big = .62 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const ink = c.ink, lw = Math.max(.006, 1.1 / c.px);
      const W = 1.46, H = 1, ax = .27, ay = .135, aw = .92, ah = .60;
      ctx.fillStyle = S.mount; ctx.beginPath(); ctx.roundRect(0, 0, W, H, .006); ctx.fill();
      ctx.strokeStyle = rgba('#000000', .22); ctx.lineWidth = lw; ctx.stroke();
      ctx.fillStyle = INK; ctx.fillRect(ax, ay, aw, ah);
      ctx.strokeStyle = rgba('#000000', .35); ctx.lineWidth = lw * 1.6; ctx.strokeRect(ax, ay, aw, ah);
      font(ctx, capFor(ctx, .145, 500, MONO), 500, MONO);
      ctx.fillStyle = CREAM; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('D.I.R.', ax + aw / 2, ay + ah / 2 + .048);
      if (!small) {
        font(ctx, capFor(ctx, .032, 500, MONO), 500, MONO);
        ctx.fillStyle = rgba(CREAM, .72);
        ctx.fillText('88.8 MHz', ax + aw / 2, ay + ah / 2 + .155);
        ctx.textAlign = 'left'; ctx.fillStyle = INK;
        ctx.fillText('DEAD INTERNET RADIO', .06, .925);
        ctx.textAlign = 'right'; ctx.fillText('35 mm', W - .06, .925);
        font(ctx, capFor(ctx, .045, 500, MONO), 500, MONO);
        ctx.fillStyle = c.accent; ctx.textAlign = 'left'; ctx.fillText('12', .06, .075);
        ctx.fillStyle = INK; ctx.textAlign = 'right'; ctx.fillText('88.8', W - .06, .075);
      }
      return W;
    },
  },
  {
    seed: '66b8cc3bb21745af26ea4f65e19ca8b004be59656be3c46e',
    name: 'Sett',
    idea: 'A tartan woven for the station, its sett taken from the seed, with the name cut clean out of the cloth.',
    init(S) {
      palette(S, false);
      S.big = .66 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const W = .98;
      const deep = mix(ORANGE, INK, .45);
      const g = 5 + Math.floor(S.r() * 4), o = 2 + Math.floor(S.r() * 2), d = 1 + Math.floor(S.r() * 2);
      const half = [{ w: g, col: CREAM }, { w: d, col: deep }, { w: o, col: c.accent }, { w: d, col: deep }, { w: Math.max(2, g * .5), col: mix(CREAM, DECK, .5) }];
      const set = [...half, ...[...half].reverse().slice(1)];
      const seq = [...set, ...set];
      const tot = seq.reduce((a, b) => a + b.w, 0);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, 1); ctx.clip();
      ctx.fillStyle = c.ground; ctx.fillRect(0, 0, W, 1);
      let x = 0;
      seq.forEach(b => { const w = b.w / tot * W; ctx.fillStyle = b.col; ctx.fillRect(x, 0, w + .002, 1); x += w; });
      ctx.globalAlpha = .5;
      let y = 0;
      seq.forEach(b => { const h = b.w / tot * 1; ctx.fillStyle = b.col; ctx.fillRect(0, y, W, h + .002); y += h; });
      ctx.globalAlpha = 1;
      ctx.restore();
      let cap = .40;
      font(ctx, capFor(ctx, cap, 700, SANS), 700, SANS);
      const ww = tw(ctx, 'D.I.R.');
      if (ww > W * .9) { cap *= W * .9 / ww; font(ctx, capFor(ctx, cap, 700, SANS), 700, SANS); }
      ctx.fillStyle = c.ground; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('D.I.R.', W / 2, .67);
      ctx.strokeStyle = rgba(CREAM, .5); ctx.lineWidth = Math.max(.008, 1.3 / c.px);
      ctx.strokeText('D.I.R.', W / 2, .67);
      return W;
    },
  },
  {
    seed: '902dd9b96e59f0ccf46e12d4ac4be31ffe20e816be735d30',
    name: 'Ace',
    idea: 'A chip for a table with no players, its inlay the ace of spades and the dial number sitting above it.',
    init(S) {
      palette(S, false);
      S.spots = 6 + (S.r() < .5 ? 0 : 2);
      S.big = .66 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const ink = INK, body = mix(CREAM, DECK, .18), lw = Math.max(.007, 1.2 / c.px);
      ctx.fillStyle = body; ctx.beginPath(); ctx.arc(.5, .5, .5, 0, 2 * PI); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(.5, .5, .5, 0, 2 * PI); ctx.clip();
      ctx.fillStyle = c.accent;
      for (let i = 0; i < S.spots; i++) {
        const a = i * 2 * PI / S.spots + PI / S.spots;
        ctx.beginPath(); ctx.arc(.5, .5, .5, a - .13, a + .13); ctx.arc(.5, .5, .355, a + .13, a - .13, true); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(.5, .5, .352, 0, 2 * PI); ctx.stroke();
      font(ctx, capFor(ctx, .05, 400, SERIF), 400, SERIF);
      ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('88.8', .5, .32);
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.arc(.437, .498, .06, 0, 2 * PI); ctx.fill();
      ctx.beginPath(); ctx.arc(.563, .498, .06, 0, 2 * PI); ctx.fill();
      ctx.beginPath(); ctx.moveTo(.5, .354); ctx.lineTo(.379, .504); ctx.lineTo(.621, .504); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(.379, .504); ctx.lineTo(.621, .504); ctx.lineTo(.5, .598); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(.469, .588); ctx.lineTo(.531, .588); ctx.lineTo(.548, .654); ctx.lineTo(.452, .654); ctx.closePath(); ctx.fill();
      font(ctx, capFor(ctx, .082, 400, SERIF), 400, SERIF);
      ctx.fillText('D.I.R.', .5, .768);
      return 1;
    },
  },
  {
    seed: 'b8272804442239cc29e5f416d8c8a468e2e880e8eda9c9fd',
    name: 'Emboss',
    idea: 'Blind debossed into card with no ink at all: the name is only a shadow and a highlight, with one printed registration mark.',
    init(S) {
      palette(S, false);
      S.card = mix(CREAM, DECK, .42 + S.r() * .16);
      S.big = .62 + S.r() * .04;
    },
    draw(ctx, c, S, small) {
      const e = 1.3 / c.px, W = 1.52, H = 1, ink = '#2b241c';
      ctx.fillStyle = S.card; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = rgba('#000000', .14); ctx.lineWidth = Math.max(.005, .9 / c.px); ctx.strokeRect(0, 0, W, H);
      ctx.lineWidth = Math.max(.006, 1 / c.px);
      ctx.strokeStyle = rgba(ink, .16); ctx.beginPath(); ctx.moveTo(.04, .04); ctx.lineTo(W - .04, .04); ctx.lineTo(W - .04, H - .04); ctx.stroke();
      ctx.strokeStyle = rgba('#fffdf7', .55); ctx.beginPath(); ctx.moveTo(.04, H - .04); ctx.lineTo(.04, .04); ctx.moveTo(.04, H - .04); ctx.lineTo(W - .04, H - .04); ctx.stroke();
      const emb = (txt, cap, wt, fam, y, k) => {
        font(ctx, capFor(ctx, cap, wt, fam), wt, fam);
        ctx.fillStyle = rgba(ink, .2); ctx.fillText(txt, W / 2, y - e * k);
        ctx.fillStyle = rgba('#fffdf7', .38); ctx.fillText(txt, W / 2, y + e * k);
        ctx.fillStyle = mix(S.card, ink, .16); ctx.fillText(txt, W / 2, y);
      };
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      font(ctx, capFor(ctx, .31, 400, SERIF), 400, SERIF);
      ctx.fillStyle = rgba(ink, .2); ctx.fillText('D.I.R.', W / 2, .552 - e);
      ctx.fillStyle = rgba('#fffdf7', .38); ctx.fillText('D.I.R.', W / 2, .552 + e);
      const bev = ctx.createLinearGradient(0, .34, 0, .566);
      bev.addColorStop(0, mix(S.card, ink, .06));
      bev.addColorStop(.5, mix(S.card, ink, .01));
      bev.addColorStop(1, mix(S.card, '#ffffff', .14));
      ctx.fillStyle = bev; ctx.fillText('D.I.R.', W / 2, .552);
      ctx.strokeStyle = rgba(ink, .16); ctx.lineWidth = Math.max(.006, 1 / c.px);
      ctx.beginPath(); ctx.moveTo(W / 2 - .255, .625 - e); ctx.lineTo(W / 2 + .255, .625 - e); ctx.stroke();
      ctx.strokeStyle = rgba('#fffdf7', .5);
      ctx.beginPath(); ctx.moveTo(W / 2 - .255, .625 + e); ctx.lineTo(W / 2 + .255, .625 + e); ctx.stroke();
      emb('DEAD INTERNET RADIO', .042, 500, MONO, .755, .7);
      ctx.strokeStyle = c.accent; ctx.lineWidth = Math.max(.007, 1.2 / c.px);
      const rx = W - .075, ry = .925, rr = .016;
      ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 2 * PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx - rr * 1.8, ry); ctx.lineTo(rx + rr * 1.8, ry); ctx.moveTo(rx, ry - rr * 1.8); ctx.lineTo(rx, ry + rr * 1.8); ctx.stroke();
      return W;
    },
  },
];

const params = new URLSearchParams(location.search);
const ONLY = params.has('only') ? Number(params.get('only')) - 1 : null;
if (ONLY !== null) document.body.classList.add('solo');

function render(v, cv) {
  const dpr = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const strip = 48, inkFor = g => g === INK ? CREAM : INK;
  ctx.fillStyle = v.S.ground; ctx.fillRect(0, 0, W, H - strip);
  const probe = document.createElement('canvas').getContext('2d'); probe.scale(100, 100);
  const uw = v.draw(probe, { ink: 'rgba(0,0,0,0)', accent: 'rgba(0,0,0,0)', ground: v.S.ground, px: 100, small: false }, v.S, false);
  let mh = (H - strip) * v.S.big;
  if (uw * mh > W * .84) mh = W * .84 / uw;
  const mw = uw * mh;
  ctx.save(); ctx.translate((W - mw) / 2, (H - strip - mh) / 2); ctx.scale(mh, mh);
  v.draw(ctx, { ink: v.S.ink, accent: ORANGE, ground: v.S.ground, px: mh, small: false }, v.S, false);
  ctx.restore();
  const sy = H - strip, sh = 36, pad = (strip - sh) / 2;
  ctx.fillStyle = DECK; ctx.fillRect(0, sy, W / 2, strip); ctx.fillStyle = INK; ctx.fillRect(W / 2, sy, W / 2, strip);
  for (const [gx, g] of [[0, DECK], [W / 2, INK]]) {
    ctx.save(); ctx.translate(gx + 16, sy + pad); ctx.scale(sh, sh);
    v.draw(ctx, { ink: inkFor(g), accent: ORANGE, ground: g, px: sh, small: true }, v.S, true);
    ctx.restore();
  }
}

function build() {
  V.forEach((v, i) => {
    const S = { r: rng(v.seed) };
    v.init(S); v.S = S;
    if (ONLY !== null && i !== ONLY) return;
    const sec = document.createElement('section');
    sec.innerHTML = `<p class="tag"><b>V${i + 1} · ${v.name}.</b> ${v.idea}</p><div class="frame"><div class="stage"><canvas></canvas></div></div>`;
    document.getElementById('lab').appendChild(sec);
    const cv = sec.querySelector('canvas'), stage = sec.querySelector('.stage');
    stage.style.background = S.ground;
    const draw = () => render(v, cv);
    draw();
    new ResizeObserver(draw).observe(stage);
  });
}

Promise.all([
  document.fonts.load(`400 40px ${SANS}`), document.fonts.load(`500 40px ${SANS}`),
  document.fonts.load(`700 40px ${SANS}`), document.fonts.load(`800 40px ${SANS}`),
  document.fonts.load(`400 20px ${MONO}`), document.fonts.load(`500 20px ${MONO}`),
  document.fonts.load(`400 40px ${SERIF}`),
]).catch(() => {}).then(build);
</script>
