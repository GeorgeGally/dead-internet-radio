<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Ident Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: VT100; src: url(../fonts/vt100-regular/vt100-regular.otf.woff2) format('woff2'); }
:root { --bg: #0e0e0d; --ink: #ece8df; --dim: #9a958c; --frame: #191918; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 'Plus Jakarta Sans', sans-serif; }
header, section { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 64px; padding-bottom: 48px; }
h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: 0; }
header p { margin: 0; color: var(--dim); max-width: 640px; }
section { margin-bottom: 80px; }
.tag { margin: 0 0 16px; max-width: 760px; }
.tag b { font-weight: 700; }
.frame { background: var(--frame); padding: 12px; border-radius: 6px; }
.stage { position: relative; aspect-ratio: 16 / 9; background: #000; cursor: pointer; overflow: hidden; border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* ?only=N : one stage, full viewport (screenshots) */
body.solo header, body.solo .tag { display: none; }
body.solo section { max-width: none; padding: 0; margin: 0; }
body.solo .frame { padding: 0; border-radius: 0; }
/* keeps the Giphy <img> animating without ever showing it */
#gifhold { position: fixed; left: -10px; top: -10px; width: 2px; height: 2px; overflow: hidden; opacity: 0; pointer-events: none; }
#gifhold img { width: 2px; height: 2px; }
</style>
</head>
<body>
<header>
  <h1>Station ident</h1>
  <p>Ten animated versions of the intro that plays while D.I.R. loads. Click any one to replay it with a station voice.</p>
</header>
<main id="lab"></main>
<div id="gifhold"></div>
<script>
'use strict';

// ---------- live station data (falls back to known shows) ----------
const DATA = {
  title: 'Ghost Platform', artist: 'Signal Void', show: 'Berlin Grid Hours', dj: 'Echo',
  next: 'Railway Scrape', startsAt: Date.now() - 60000, durationMs: 180000,
  shows: ['Berlin Grid Hours', 'Empty U-Bahn Signal', 'Winter Transit Loop', 'Static Frost Descent', 'Monochrome Disco Drift', 'Robot Synth Friday', 'Empty Arp Sunrise'],
};
fetch('/api/v1/broadcast').then(r => r.json()).then(d => {
  const [s, n] = d.segments || [];
  if (s) Object.assign(DATA, { title: s.title, artist: s.artist, show: s.showName, dj: s.djName, startsAt: s.startsAt + (Date.now() - d.serverTime), durationMs: s.durationMs });
  if (n) DATA.next = n.title;
}).catch(() => {});
fetch('/api/v1/shows').then(r => r.json()).then(a => {
  const names = [...new Set(a.map(s => s.name).filter(n => n && n.length > 4))];
  if (names.length > 3) DATA.shows = names.slice(0, 7);
}).catch(() => {});
const progress = () => clamp((Date.now() - DATA.startsAt) / DATA.durationMs);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const ramp = (t, s, d) => clamp((t - s) / d);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const TAU = Math.PI * 2;
function rng(hex) {
  let a = parseInt(hex.slice(0, 8), 16) >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function h32(n) { n = Math.imul(n ^ n >>> 16, 0x45d9f3b); n = Math.imul(n ^ n >>> 16, 0x45d9f3b); return (n ^ n >>> 16) >>> 0; }
const hx = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const grey = (a, f) => { const [r, g, b] = hx(a); const l = Math.round((.3 * r + .59 * g + .11 * b) * f); return '#' + [l, l, l].map(v => v.toString(16).padStart(2, '0')).join(''); };
const rgba = (hex, a) => { const [r, g, b] = hx(hex); return `rgba(${r},${g},${b},${a})`; };
const JK = (wt, px) => `${wt} ${px}px 'Plus Jakarta Sans', sans-serif`;
const MONO = (px, wt = 400) => `${wt} ${px}px 'IBM Plex Mono', monospace`;
const ORANGE = '#ff5a1f', CREAM = '#f2eee6';
const CTA = '▶ Tune in';
const clock = () => new Date().toTimeString().slice(0, 8);

const NZ = document.createElement('canvas'); NZ.width = 256; NZ.height = 144;
const nzx = NZ.getContext('2d'); const nzImg = nzx.createImageData(256, 144);
function noise(ctx, w, h, alpha, lo = 0, hi = 255, x = 0, y = 0) {
  if (alpha <= 0) return;
  const d = nzImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = lo + Math.random() * (hi - lo); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  nzx.putImageData(nzImg, 0, 0);
  ctx.save(); ctx.globalAlpha = alpha; ctx.imageSmoothingEnabled = false; ctx.drawImage(NZ, x, y, w, h); ctx.restore();
}
function scan(ctx, w, h, a = .18) {
  ctx.save(); ctx.fillStyle = `rgba(0,0,0,${a})`;
  const s = Math.max(2, Math.round(h / 240));
  for (let y = 0; y < h; y += s * 2) ctx.fillRect(0, y, w, s);
  ctx.restore();
}
function txt(ctx, s, x, y, font, color, alpha = 1, align = 'left', base = 'alphabetic') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); ctx.restore();
}
function fitFont(ctx, s, wt, px, maxW, fam = JK) { ctx.font = fam(wt, px); const m = ctx.measureText(s).width; return m > maxW ? px * maxW / m : px; }
// Rasterise text into an on/off grid (letters as data for mosaics and blips).
function mask(text, W, H, weight = 800) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let px = H * .95; x.font = JK(weight, px);
  const m = x.measureText(text).width; if (m > W * .96) { px *= W * .96 / m; x.font = JK(weight, px); }
  x.fillText(text, W / 2, H / 2 + px * .04);
  const d = x.getImageData(0, 0, W, H).data; const on = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) on[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  return { W, H, on };
}
// The one action: a solid key, sized to the type, never oversized.
function key(ctx, x, y, u, alpha, o = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = MONO(2.8 * u, 500);
  const label = o.label || CTA, tw = ctx.measureText(label).width, pw = 1.6 * u, kh = 5 * u, kw = tw + pw * 2;
  const kx = o.align === 'right' ? x - kw : x;
  ctx.fillStyle = o.bg || CREAM; ctx.fillRect(kx, y - kh * .72, kw, kh);
  ctx.fillStyle = o.fg || '#0b0b0b'; ctx.textBaseline = 'alphabetic'; ctx.fillText(label, kx + pw, y);
  ctx.restore();
}
// Mark, caption tight beneath it, a clear step, then the one action.
function ident(ctx, w, h, t, t0, x, y, o = {}) {
  const u = h / 100, size = o.size || 13 * u;
  txt(ctx, '/D.I.R.', x, y, JK(800, size), o.color || CREAM, ramp(t, t0, .7));
  txt(ctx, o.sub || 'Dead Internet Radio', x, y + 3.2 * u + size * .18, MONO(3.1 * u), o.dim || 'rgba(242,238,230,.8)', ramp(t, t0 + .4, .7));
  if (o.prompt !== false) key(ctx, x, y + 12 * u + size * .18, u, ramp(t, t0 + 1, .7), { bg: o.accent || CREAM });
}
// Broadcast furniture: two readouts on the top margin.
function hud(ctx, w, h, t, t0, left, right, color = 'rgba(242,238,230,.7)') {
  const u = h / 100;
  txt(ctx, left, 6 * u, 7 * u, MONO(2.6 * u), color, ramp(t, t0, .6));
  txt(ctx, right, w - 6 * u, 7 * u, MONO(2.6 * u), color, ramp(t, t0, .6), 'right');
}

// ---------- the ten versions ----------
const V = [];

// V1 — EBU test card
V.push({
  name: 'Test card', seed: '40eaaaeda98b51ace3bf9812', L: 9,
  idea: 'EBU colour bars drain to grey one at a time. One bar keeps the station orange, and the station ID fades up straight onto the bars.',
  init(S) { S.keep = 1; },
  draw(c, w, h, t, S) {
    const u = h / 100, bw = w / 7;
    const bars = ['#bfbfbf', '#bfbf00', '#00bfbf', '#00bf00', '#bf00bf', '#bf0000', '#0000bf'];
    const rev = ['#0000bf', '#131313', '#bf00bf', '#131313', '#00bfbf', '#131313', '#bfbfbf'];
    const ramp7 = ['#ebebeb', '#bfbfbf', '#939393', '#686868', '#3c3c3c', '#1d1d1d', '#090909'];
    const kOf = i => ease(ramp(t, 1.6 + i * .14, .6));
    for (let i = 0; i < 7; i++) {
      const k = kOf(i), x = Math.round(i * bw), xw = Math.round((i + 1) * bw) - x;
      c.fillStyle = i === S.keep ? mix(bars[i], ORANGE, k) : mix(bars[i], grey(bars[i], .3), k);
      c.fillRect(x, 0, xw, h * .67);
      c.fillStyle = mix(rev[i], grey(rev[i], .3), kOf(6 - i)); c.fillRect(x, h * .67, xw, h * .08);
      c.fillStyle = mix(ramp7[i], grey(ramp7[i], .3), kOf(i)); c.fillRect(x, h * .75, xw, h * .25);
    }
    // station ID straight onto the drained bars, hung off the orange bar's right edge
    ident(c, w, h, t, 3.4, Math.round(2 * bw) + 4 * u, h * .44, { size: 14 * u, prompt: false });
    noise(c, w, h, .05 + .5 * (1 - ramp(t, 0, .7)));
    scan(c, w, h, .12);
  },
});

// V2 — CRT power-on
V.push({
  name: 'Tube warm-up', seed: '73ccda790679333bed3a2b35', L: 8.5,
  idea: 'A cold CRT switches on: a white line opens into a raster of snow, the vertical hold settles, and the ident and the channel readouts come through the static.',
  draw(c, w, h, t) {
    const u = h / 100;
    c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
    const a = ease(ramp(t, .15, .35)), b = ease(ramp(t, .55, .45));
    if (t < .55) {
      const lw = w * a; c.fillStyle = '#fff'; c.fillRect((w - lw) / 2, h / 2 - u * .35, lw, u * .7);
    } else {
      const rh = Math.max(u, h * b), y0 = (h - rh) / 2;
      c.save(); c.beginPath(); c.rect(0, y0, w, rh); c.clip();
      const settle = ramp(t, 1.2, 2.4);
      c.fillStyle = '#161616'; c.fillRect(0, 0, w, h);
      noise(c, w, h, 1 - settle * .84, 20, 235);
      // line jitter: a few rows slip sideways while the hold settles
      for (let k = 0; k < 6; k++) { const yy = (h32(k + Math.floor(t * 20)) % 1000) / 1000 * h; c.drawImage(c.canvas, 0, yy, w, u * .6, (1 - settle) * 3 * u, yy, w, u * .6); }
      const roll = 1 - settle;
      if (roll > 0) {
        const yy = ((t * .9) % 1) * h * 1.3 - h * .15;
        c.fillStyle = `rgba(0,0,0,${.6 * roll})`; c.fillRect(0, yy, w, h * .12);
        c.fillStyle = `rgba(255,255,255,${.12 * roll})`; c.fillRect(0, yy + h * .12, w, h * .015);
      }
      c.fillStyle = `rgba(255,255,255,${.7 * (1 - ramp(t, .55, .6))})`; c.fillRect(0, 0, w, h);
      hud(c, w, h, t, 2.4, '88.8 MHz', clock());
      txt(c, 'ON AIR', 6 * u, 12 * u, MONO(2.6 * u, 500), ORANGE, ramp(t, 3, .6));
      ident(c, w, h, t, 2.6, 6 * u, h - 22 * u, { size: 15 * u, prompt: false });
      c.restore();
    }
    const g = c.createRadialGradient(w / 2, h / 2, h * .38, w / 2, h / 2, w * .64);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.8)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    scan(c, w, h, .22);
  },
});

// V3 — Ceefax page 100
V.push({
  name: 'Teletext P100', seed: '129ad417529105fb98413c1c', L: 10,
  idea: 'The page counter searches until it lands on 100, then a 4:3 teletext page arrives row by row on a strict 40×25 grid: a sextant-mosaic D.I.R. and the show on air.',
  init(S) {
    S.col = ['#ffff00', '#00ffff', '#ffffff'][Math.floor(S.r() * 3)];
    S.err = Array.from({ length: 22 }, () => [2 + Math.floor(S.r() * 36), 2 + Math.floor(S.r() * 20), 2.6 + S.r() * 2.2, Math.floor(S.r() * 7)]);
  },
  draw(c, w, h, t, S) {
    // the page lives in a 4:3 picture, pillarboxed like teletext on a 16:9 set
    const cols = 40, rows = 25, pw = Math.min(w, h * 4 / 3), cw = pw / cols, ch = h / rows;
    c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
    c.save(); c.translate((w - pw) / 2, 0);
    if (!S.m) S.m = mask('D.I.R.', 72, 27);
    const TT = ['#ff0000', '#00ff00', '#ffff00', '#0000ff', '#ff00ff', '#00ffff', '#ffffff'];
    const put = (col, row, s, fg, bg, dbl) => {
      const rh = ch * (dbl ? 2 : 1);
      if (bg) { c.fillStyle = bg; c.fillRect(col * cw, row * ch, s.length * cw + .5, rh + .5); }
      c.save(); c.font = `${rh * .92}px VT100`; c.textBaseline = 'top'; c.fillStyle = fg;
      const mw = c.measureText('M').width; c.translate(col * cw, row * ch + rh * .06); c.scale(cw / mw, 1); c.fillText(s, 0, 0); c.restore();
    };
    const vis = r => t > 2.3 + r * .06;
    const searching = t < 2.2;
    const pn = searching ? '1' + String((Math.floor(t * 23) * 7) % 100).padStart(2, '0') : '100';
    const date = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' }).replace(',', '');
    // header: page, service, date, clock spread across the 40 columns
    put(2, 0, `P${pn}`, searching ? '#00ff00' : '#ffffff');
    put(8, 0, 'D.I.R.', '#ffffff');
    put(19, 0, date, '#ffffff');
    put(30, 0, clock(), '#ffff00');
    if (vis(2)) { put(0, 2, ' '.repeat(40), '#fff', '#0000ff', true); if (Math.floor(t * 1.4) % 2 === 0) put(2, 2, 'ON AIR', '#ffffff', null, true); put(30, 2, '88.8 MHz', '#ffff00', null, true); }
    for (let cy = 0; cy < 9; cy++) {
      if (!vis(5 + cy)) continue;
      for (let cx = 0; cx < 36; cx++) for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 2; sx++) {
        if (!S.m.on[(cy * 3 + sy) * 72 + cx * 2 + sx]) continue;
        c.fillStyle = S.col;
        c.fillRect((2 + cx) * cw + sx * cw / 2, (5 + cy) * ch + sy * ch / 3, cw / 2 + .5, ch / 3 + .5);
      }
    }
    if (vis(16)) put(2, 16, 'Dead Internet Radio.', '#ffffff');
    if (vis(17)) put(2, 17, 'Music made by machines.', '#ffffff');
    const row = (r, label, value) => { if (vis(r)) { put(2, r, label, '#00ff00'); put(8, r, value.slice(0, 30), '#00ffff'); } };
    row(20, 'SHOW', DATA.show); row(21, 'DJ', DATA.dj);
    for (const [col, r, until, ci] of S.err) if (vis(r) && t < until && (r < 5 || r > 13)) {
      put(col, r, String.fromCharCode(33 + h32(col * 99 + r + Math.floor(t * 8)) % 90), TT[ci], '#000');
    }
    // raster: 10 scan lines per character row, so lines never beat against the glyphs
    c.fillStyle = 'rgba(0,0,0,.22)';
    for (let i = 0; i < rows * 10; i++) c.fillRect(0, (i + .6) * ch / 10, pw, ch / 25);
    c.restore();
  },
});

// V4 — analogue tuning dial
V.push({
  name: 'Tuning dial', seed: '7ba3f37c1d32c9ab3cf7f679', L: 9,
  idea: 'The dial owns the screen. The needle sweeps past the other D.I.R. shows through static, locks on 88.8, the meter reads full and the station starts talking.',
  init(S) { S.np = .3 + S.r() * .14; },
  draw(c, w, h, t, S) {
    const u = h / 100, lockT = 3.8;
    c.fillStyle = '#1c1b1a'; c.fillRect(0, 0, w, h);
    const f = 88.8 + 14.9 * Math.exp(-1.05 * t) * Math.cos(1.85 * t) * (1 - ease(ramp(t, 2.6, 1.2)));
    const fq = DATA.shows.map((n, i) => [90.6 + i * 2.55, n]);
    let sig = Math.exp(-Math.pow((f - 88.8) * 3, 2));
    fq.forEach(([q]) => sig = Math.max(sig, .7 * Math.exp(-Math.pow((f - q) * 3, 2))));
    if (t > lockT) sig = 1;
    // header row: mark left, readout right
    txt(c, '/D.I.R.', 6 * u, 17 * u, JK(800, 9 * u), CREAM, ramp(t, lockT + .2, .7));
    fq.forEach(([q, n]) => { const s = Math.exp(-Math.pow((f - q) * 3, 2)); if (s > .05 && t < lockT) txt(c, n, 6 * u, 17 * u, JK(700, 6 * u), CREAM, s * .45); });
    txt(c, `Now  ${DATA.title} · ${DATA.artist}`, w - 6 * u, 10 * u, MONO(2.8 * u), 'rgba(242,238,230,.75)', ramp(t, lockT + .6, .7), 'right');
    key(c, w - 6 * u, 17 * u, u, ramp(t, lockT + 1.2, .7), { align: 'right', bg: ORANGE });
    // dial window: the hero
    const x0 = 6 * u, x1 = w - 6 * u, y0 = 26 * u, y1 = h - 14 * u, nx = w * S.np, ppm = w / 7;
    c.fillStyle = '#0d0c0b'; c.fillRect(x0, y0, x1 - x0, y1 - y0);
    c.save(); c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip();
    noise(c, x1 - x0, y1 - y0, (1 - sig) * .28 + .03, 0, 160, x0, y0);
    const base = y0 + (y1 - y0) * .5;
    for (let q = 860; q <= 1100; q += 1) {
      const x = nx + (q / 10 - f) * ppm, mhz = q % 10 === 0, half = q % 5 === 0;
      const len = mhz ? 5 * u : half ? 3 * u : 1.6 * u;
      c.fillStyle = mhz ? 'rgba(217,212,202,.9)' : half ? 'rgba(217,212,202,.5)' : 'rgba(217,212,202,.25)';
      c.fillRect(x, base - len, Math.max(1, u * .16), len);
      if (mhz) txt(c, String(q / 10), x, base - 7 * u, MONO((q / 10) % 2 ? 2.2 * u : 3 * u), `rgba(217,212,202,${(q / 10) % 2 ? .5 : .9})`, 1, 'center');
    }
    c.fillStyle = 'rgba(217,212,202,.25)'; c.fillRect(x0, base, x1 - x0, 1);
    for (const q of [89.4, 92.1, 95.2, 97.6, 99.9, 103.4, 105.7]) { const x = nx + (q - f) * ppm; c.fillStyle = 'rgba(217,212,202,.18)'; c.fillRect(x - .25 * u, base + 1.2 * u, .5 * u, .5 * u); }
    const station = (q, n, col) => { const x = nx + (q - f) * ppm; c.fillStyle = col; c.beginPath(); c.moveTo(x, base + .6 * u); c.lineTo(x - .9 * u, base + 2.2 * u); c.lineTo(x + .9 * u, base + 2.2 * u); c.fill(); txt(c, n, x, base + 6.5 * u, MONO(2.4 * u), col, 1, 'center'); };
    fq.forEach(([q, n]) => station(q, n, 'rgba(217,212,202,.6)'));
    station(88.8, 'Dead Internet Radio', ORANGE);
    c.restore();
    c.fillStyle = ORANGE; c.fillRect(nx - u * .2, y0, u * .4, y1 - y0);
    // meter: shows the actual level
    const lit = Math.round(sig * 10);
    for (let i = 0; i < 10; i++) { c.fillStyle = i < lit ? CREAM : '#3a3836'; c.fillRect(x0 + i * 1.5 * u, h - 8.2 * u, .7 * u, 2.6 * u); }
    txt(c, `SIGNAL ${String(lit * 10).padStart(3, ' ')}%`, x0 + 16 * u, h - 5.8 * u, MONO(2.4 * u), 'rgba(217,212,202,.65)');
    txt(c, `${f.toFixed(1)} MHz`, x1, h - 5.2 * u, MONO(4.4 * u, 500), CREAM, 1, 'right');
  },
});

// V5 — X-Y oscilloscope
V.push({
  name: 'Oscilloscope', seed: '8f319517b496af6bb2153d61', L: 10,
  idea: 'A phosphor beam runs a sine sweep, folds into a Lissajous figure, then writes DIR as one continuous stroke, with faint retrace between letters.',
  init(S) { S.hue = S.r() < .5 ? '#a6ffb4' : '#ffc46b'; },
  build(S) {
    // single-stroke letters, x 0..1 per glyph, y 0..1 up; null = beam retrace
    const arc = (cx, cy, rx, ry, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + rx * Math.sin(a), cy + ry * Math.cos(a)]; });
    const D = [[0, 0], [0, 1], [.18, 1], ...arc(.18, .5, .42, .5, 0, Math.PI), [0, 0]];
    const I = [[.0, 0], [.0, 1]];
    const R = [[0, 0], [0, 1], [.24, 1], ...arc(.24, .74, .28, .26, 0, Math.PI), [0, .48], [.2, .48], [.52, 0]];

      if (!lit) { c.strokeStyle = '#2b2b29'; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, cw - 1, ch - 1); }
      c.restore();
      c.save(); c.beginPath(); c.rect(x, y, cw, ch); c.clip();
      const words = S.txt[i].split(' '); let line = '', ly = y + 4.4 * u; c.font = MONO(2.3 * u);
      c.globalAlpha = al * (surv ? 1 - ramp(t, 6, .4) : 1); c.fillStyle = '#8d887f';
      for (const wd of words) { const tst = line ? line + ' ' + wd : wd; if (c.measureText(tst).width > cw - 3 * u && line) { c.fillText(line, x + 1.6 * u, ly); line = wd; ly += 3.2 * u; } else line = tst; }
      c.fillText(line, x + 1.6 * u, ly);
      c.restore();
      if (surv) {
        const fs = fitFont(c, '/D.I.R.', 800, ch * .34, cw - 3.2 * u);
        txt(c, '/D.I.R.', x + 1.6 * u, y + ch - 1.6 * u, JK(800, fs), '#0b0b0b', ramp(t, 6.8, .7));
      }
    }
    hud(c, w, h, t, 6.4, `88.8 MHz · ${S.cols * S.rows - 1} pages offline`, clock());
    c.font = MONO(3 * u); const lead = 'Dead Internet Radio is still broadcasting. Now playing ';
    txt(c, lead, x0, h - 8 * u, MONO(3 * u), 'rgba(242,238,230,.75)', ramp(t, 7.4, .7));
    txt(c, DATA.title, x0 + c.measureText(lead).width, h - 8 * u, MONO(3 * u, 500), CREAM, ramp(t, 7.4, .7));
    key(c, w - 6 * u, h - 7.6 * u, u, ramp(t, 8, .7), { align: 'right' });
  },
});

// ---------- engine ----------
const params = new URLSearchParams(location.search);
const ONLY = params.has('only') ? Number(params.get('only')) - 1 : null;
const FREEZE = params.has('t') ? Number(params.get('t')) : null;
if (ONLY !== null) document.body.classList.add('solo');
let voice = null;

const stages = [];
V.forEach((v, i) => {
  if (ONLY !== null && i !== ONLY) return;
  const sec = document.createElement('section');
  sec.innerHTML = `<p class="tag"><b>V${i + 1} · ${v.name}.</b> ${v.idea}</p><div class="frame"><div class="stage"><canvas></canvas></div></div>`;
  document.getElementById('lab').appendChild(sec);
  const stage = sec.querySelector('.stage'), cv = sec.querySelector('canvas');
  const S = { r: rng(v.seed), start: performance.now(), visible: ONLY !== null };
  if (v.init) v.init(S);
  const st = { v, S, cv, ctx: cv.getContext('2d') };
  new ResizeObserver(() => {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    cv.width = Math.round(stage.clientWidth * dpr); cv.height = Math.round(stage.clientHeight * dpr);
  }).observe(stage);
  new IntersectionObserver(([e]) => { S.visible = e.isIntersecting || ONLY !== null; }, { rootMargin: '100px' }).observe(stage);
  stage.addEventListener('click', () => {
    S.start = performance.now();
    if (voice) voice.pause();
    voice = new Audio(`../welcome/welcome-${1 + Math.floor(Math.random() * 4)}.wav`);
    voice.play().catch(() => {});
  });
  stages.push(st);
});

function frame(now) {
  for (const { v, S, cv, ctx } of stages) {
    if (!S.visible || !cv.width) continue;
    let t = FREEZE !== null ? FREEZE : (now - S.start) / 1000;
    if (FREEZE === null && t > v.L) { S.start = now; t = 0; }
    const w = cv.width, h = cv.height;
    ctx.save(); v.draw(ctx, w, h, t, S); ctx.restore();
    if (FREEZE === null && t > v.L - .6) { ctx.fillStyle = `rgba(0,0,0,${ramp(t, v.L - .6, .6)})`; ctx.fillRect(0, 0, w, h); }
  }
  requestAnimationFrame(frame);
}

Promise.all([
  document.fonts.load(JK(800, 40)), document.fonts.load(JK(700, 40)), document.fonts.load(JK(400, 40)),
  document.fonts.load(MONO(20)), document.fonts.load(MONO(20, 500)), document.fonts.load('20px VT100'),
]).catch(() => {}).then(() => { stages.forEach(s => s.S.start = performance.now()); requestAnimationFrame(frame); });
</script>
