<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Ident Lab · Fable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: VT100; src: url(../fonts/vt100-regular/vt100-regular.otf.woff2) format('woff2'); }
:root { --bg: #0e0e0d; --ink: #ece8df; --dim: #9a958c; --frame: #191918; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 'Plus Jakarta Sans', sans-serif; }
header, section { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 64px; padding-bottom: 48px; }
h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; }
header p { margin: 0; color: var(--dim); max-width: 640px; }
section { margin-bottom: 80px; }
.tag { margin: 0 0 16px; max-width: 760px; }
.tag b { font-weight: 700; }
.frame { background: var(--frame); padding: 12px; border-radius: 6px; }
.stage { position: relative; aspect-ratio: 16 / 9; background: #000; cursor: pointer; overflow: hidden; border-radius: 2px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* ?only=N&t=S : one stage, full viewport, frozen at S seconds (screenshots) */
body.solo header, body.solo .tag { display: none; }
body.solo section { max-width: none; padding: 0; margin: 0; }
body.solo .frame { padding: 0; border-radius: 0; }
/* keeps the Giphy <img> animating without ever showing it (Chrome stops animating hidden images) */
#gifhold { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: .01; pointer-events: none; }
#gifhold img { width: 1px; height: 1px; }
</style>
</head>
<body>
<header>
  <h1>Station ident · second lab</h1>
  <p>Ten more animated versions of the intro that plays while D.I.R. loads. A pure ID each time: the mark over a picture. Click any one to replay it with a station voice.</p>
</header>
<main id="lab"></main>
<div id="gifhold"></div>
<script>
'use strict';

// ---------- live station furniture (show and DJ names only; never a song title) ----------
const DATA = { show: 'Berlin Grid Hours', dj: 'Echo' };
fetch('/api/v1/broadcast').then(r => r.json()).then(d => {
  const s = (d.segments || [])[0];
  if (s && s.showName) { DATA.show = s.showName; DATA.dj = s.djName || DATA.dj; }
}).catch(() => {});

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const ramp = (t, s, d) => clamp((t - s) / d);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const TAU = Math.PI * 2;
function rng(hex) {
  let a = parseInt(hex.slice(0, 8), 16) >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function h32(n) { n = Math.imul(n ^ n >>> 16, 0x45d9f3b); n = Math.imul(n ^ n >>> 16, 0x45d9f3b); return (n ^ n >>> 16) >>> 0; }
const byte = (hex, i) => parseInt(hex.slice(i * 2, i * 2 + 2), 16) / 255;   // seed byte i → 0..1
const hx = s => s[0] === '#' ? [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)) : s.match(/\d+/g).slice(0, 3).map(Number);   // '#rrggbb' or 'rgb(r,g,b)'
const mix = (a, b, k) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
const rgba = (hex, a) => { const [r, g, b] = hx(hex); return `rgba(${r},${g},${b},${a})`; };
const JK = (wt, px) => `${wt} ${px}px 'Plus Jakarta Sans', sans-serif`;
const MONO = (px, wt = 400) => `${wt} ${px}px 'IBM Plex Mono', monospace`;
const VT = px => `${px}px VT100, monospace`;
const ORANGE = '#ff5a1f', CREAM = '#f2eee6', INK = '#0b0b0a';
const clock = () => new Date().toTimeString().slice(0, 5);

const NZ = document.createElement('canvas'); NZ.width = 256; NZ.height = 144;
const nzx = NZ.getContext('2d'); const nzImg = nzx.createImageData(256, 144);
function noise(ctx, w, h, alpha, lo = 0, hi = 255, streak = 1) {
  if (alpha <= 0) return;
  const d = nzImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = lo + Math.random() * (hi - lo); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  nzx.putImageData(nzImg, 0, 0);
  ctx.save(); ctx.globalAlpha = alpha; ctx.imageSmoothingEnabled = false; ctx.drawImage(NZ, 0, 0, 256 / streak, 144, 0, 0, w, h); ctx.restore();
}
function scan(ctx, w, h, a = .18) {
  ctx.save(); ctx.fillStyle = `rgba(0,0,0,${a})`;
  const s = Math.max(2, Math.round(h / 240));
  for (let y = 0; y < h; y += s * 2) ctx.fillRect(0, y, w, s);
  ctx.restore();
}
function vignette(ctx, w, h, a = .7) {
  const g = ctx.createRadialGradient(w / 2, h / 2, h * .4, w / 2, h / 2, w * .66);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}
function txt(ctx, s, x, y, font, color, alpha = 1, align = 'left', base = 'alphabetic', ls = '0px') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = ls; ctx.fillText(s, x, y); ctx.restore();
}
// the wordmark, always the same cut: Plus Jakarta Sans 800, tracked -0.02em
const mark = (ctx, x, y, size, color, alpha = 1, align = 'left') => txt(ctx, '/D.I.R.', x, y, JK(800, size), color, alpha, align, 'alphabetic', `${-size * .02}px`);
// where the mark's ink actually starts and ends (the slash has side bearing), so other lines can align to ink, not to the origin
function markInk(ctx, size) {
  ctx.save(); ctx.font = JK(800, size); ctx.letterSpacing = `${-size * .02}px`; const m = ctx.measureText('/D.I.R.'); ctx.restore();
  return { left: -m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight, width: m.actualBoundingBoxRight + m.actualBoundingBoxLeft };
}
// Rasterise text into an on/off grid (letters as data for pixels and cells).
function mask(text, W, H, fontOf = px => JK(800, px), pad = .96) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let px = H * .95; x.font = fontOf(px); x.letterSpacing = `${-px * .02}px`;
  const m = x.measureText(text).width; if (m > W * pad) { px *= W * pad / m; x.font = fontOf(px); x.letterSpacing = `${-px * .02}px`; }
  x.fillText(text, W / 2, H / 2 + px * .04);
  const d = x.getImageData(0, 0, W, H).data; const on = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) on[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  return { W, H, on };
}
// 3×5 pixel font (only the glyphs the lab needs)
const PX5 = { A: '010101111101101', D: '110101101101110', E: '111100110100111', I: '111010010010111', N: '101111111101101', T: '111010010010010', R: '110101110101101', O: '111101101101111',
  0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001001001001', 8: '111101111101111', 9: '111101111001111', ':': '000010000010000', ' ': '000000000000000' };
const pxWidth = s => s.length * 4 - 1;
function pxText(put, s, x0, y0) { [...s].forEach((ch, i) => { const g = PX5[ch] || PX5[' ']; for (let k = 0; k < 15; k++) if (g[k] === '1') put(x0 + i * 4 + k % 3, y0 + Math.floor(k / 3)); }); }
// the mark as a matrix glyph set: 11 rows, every stroke exactly two cells, so a dot board renders it the way it renders a route number
const DOT = {
  '/': ['000011', '000011', '000110', '000110', '001100', '001100', '011000', '011000', '110000', '110000', '110000'],
  D: ['1111100', '1111110', '1100011', '1100011', '1100011', '1100011', '1100011', '1100011', '1100011', '1111110', '1111100'],
  I: ['11', '11', '11', '11', '11', '11', '11', '11', '11', '11', '11'],
  R: ['1111100', '1111110', '1100011', '1100011', '1111110', '1111100', '1101100', '1100110', '1100011', '1100011', '1100011'],
  '.': ['00', '00', '00', '00', '00', '00', '00', '00', '00', '11', '11'],
};
const dotWidth = s => [...s].reduce((a, ch) => a + DOT[ch][0].length + 1, -1);
function dotText(put, s, x0, y0, k = 1) { let x = x0; for (const ch of s) { const g = DOT[ch]; g.forEach((row, y) => [...row].forEach((b, xx) => { if (b === '1') for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) put(x + xx * k + i, y0 + y * k + j); })); x += (g[0].length + 1) * k; } }

// ---------- the ten versions ----------
const V = [];

// V1 — flip-disc board
V.push({
  name: 'Flip-disc board', seed: 'deb6619fd750f2377d3d8390039da941a2a30cb760912c89', L: 9,
  idea: 'A black flip-disc board, the kind on the front of a bus. One wave of flips crosses it and the discs that turn over leave the mark; a second wave brings the destination line. A few discs are stuck.',
  // seed → column count (byte 0), disc colour warmth (byte 1), which discs are stuck, each disc\'s flip jitter and its lit brightness
  init(S) { S.cols = 84 + Math.round(byte(S.seed, 0) * 20); S.disc = mix('#ece4c9', '#f1dc96', byte(S.seed, 1)); },
  draw(c, w, h, t, S) {
    if (S.w !== w) {
      S.w = w; const cols = S.cols, pitch = w / cols, rows = Math.floor(h / pitch);
      S.pitch = pitch; S.rows = rows; S.y0 = (h - rows * pitch) / 2;
      S.on = new Float32Array(cols * rows);   // 0 = never flips, else the wave that flips it (1: mark, 2: destination)
      const k = 2, mw = dotWidth('/D.I.R.') * k, ox = Math.round((cols - mw) / 2), oy = Math.round((rows - 22 - 9) / 2);
      dotText((x, y) => { S.on[y * cols + x] = 1; }, '/D.I.R.', ox, oy, k);
      pxText((x, y) => { S.on[y * cols + x] = 2; }, 'DEAD INTERNET RADIO', Math.round((cols - pxWidth('DEAD INTERNET RADIO')) / 2), oy + 22 + 4);
      const r = rng(S.seed.slice(8)); S.stuck = new Uint8Array(cols * rows); S.jit = new Float32Array(cols * rows); S.lum = new Float32Array(cols * rows);
      for (let i = 0; i < cols * rows; i++) { S.stuck[i] = r() < .006 ? 1 : 0; S.jit[i] = r() * .16; S.lum[i] = .92 + r() * .08; }
    }
    c.fillStyle = '#0a0a09'; c.fillRect(0, 0, w, h);
    const { cols, rows, pitch } = S, R = pitch * .44, speed = 2.1 / cols;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y * cols + x, wave = S.on[i], tf = (wave === 2 ? 4.4 : .7) + x * speed + S.jit[i];
      let a;
      if (wave && !S.stuck[i]) a = Math.PI * ease(ramp(t, tf, .26));
      else a = S.stuck[i] ? 0 : Math.PI * .42 * Math.sin(ramp(t, .7 + x * speed + S.jit[i], .22) * Math.PI);   // a twitch as the first wave passes
      const front = a > Math.PI / 2;
      if (front) { c.globalAlpha = S.lum[i]; c.fillStyle = S.disc; } else { c.globalAlpha = 1; c.fillStyle = '#12110c'; }
      c.beginPath(); c.ellipse(x * pitch + pitch / 2, S.y0 + y * pitch + pitch / 2, Math.max(.35, R * Math.abs(Math.cos(a))), R, 0, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  },
});

// V2 — VHS
V.push({
  name: 'VHS', seed: 'c2226d9b8c130758f2a104ac4080d8b761c15039af56f809', L: 9,
  idea: 'A tape playing a picture the station never finished: the heads chase the tracking, colour smears to the right, the blacks never get black, and the mark is recorded on the tape with it.',
  // seed → footage search term (byte 0), tracking wobble (byte 1), counter start (byte 2), which clip (byte 3)
  init(S) {
    const terms = ['night drive rain', 'empty street night', 'city lights timelapse', 'night highway', 'rain window'];
    S.term = terms[Math.floor(byte(S.seed, 0) * terms.length)];
    S.wob = 1.6 + byte(S.seed, 1) * 2.4; S.cnt0 = Math.floor(byte(S.seed, 2) * 40) * 60 + 7;
    S.off = document.createElement('canvas');
    fetch(`https://api.giphy.com/v1/gifs/search?api_key=23JUZnCbRcIFMOcQtjTZT1ZIwtfdbbc5&q=${encodeURIComponent(S.term)}&limit=25&rating=pg-13`)
      .then(r => r.json()).then(d => {
        const g = d.data[Math.floor(byte(S.seed, 3) * d.data.length)]; if (!g) return;
        const img = new Image(); img.crossOrigin = 'anonymous'; img.src = g.images.fixed_height?.url || g.images.downsized.url;   // 200 lines is plenty for tape
        img.onload = () => { S.img = img; }; document.getElementById('gifhold').appendChild(img);
      }).catch(() => {});
  },
  draw(c, w, h, t, S) {
    const u = h / 100, lock = ease(ramp(t, .3, 2.5)), wob = (1 - lock) * S.wob * u, m = 7 * u;
    if (S.off.width !== w || S.off.height !== h) { S.off.width = w; S.off.height = h; }
    const o = S.off.getContext('2d');
    o.fillStyle = '#16161a'; o.fillRect(0, 0, w, h);   // tape never reaches black
    if (S.img) {
      const iw = S.img.naturalWidth, ih = S.img.naturalHeight, sc = Math.max(w / iw, h / ih);
      o.save(); o.globalAlpha = .86; o.filter = 'saturate(.55) contrast(.95) brightness(.8) blur(.5px)';
      o.drawImage(S.img, (w - iw * sc) / 2, (h - ih * sc) / 2, iw * sc, ih * sc); o.restore();
    } else noise(o, w, h, .3, 10, 90, 4);
    // chroma is low-resolution on tape and smears to the right
    o.save(); o.globalAlpha = .2; o.globalCompositeOperation = 'lighter'; o.filter = 'saturate(4) blur(1.5px)'; o.drawImage(S.off, 1.2 * u, 0); o.restore();
    c.fillStyle = '#101013'; c.fillRect(0, 0, w, h);
    const strips = 40, sh = h / strips, fr = Math.floor(t * 24);
    for (let i = 0; i < strips; i++) {
      const y = i * sh, dx = wob * Math.sin(t * 7 + i * .55) + (1 - lock) * ((h32(i * 31 + fr) % 9) - 4) * u * .35;
      c.drawImage(S.off, 0, y, w, sh + 1, dx, y, w, sh + 1);
    }
    // head-switching band at the bottom: the picture slips sideways and breaks into line noise
    const bh = h * (.09 - .05 * lock), by = h - bh;
    c.drawImage(S.off, 0, by, w, bh, (1 - lock) * 9 * u + 2 * u, by, w, bh);
    c.save(); c.beginPath(); c.rect(0, by, w, bh); c.clip(); noise(c, w, h, .55 - .2 * lock, 30, 200, 6); c.restore();
    c.fillStyle = `rgba(255,255,255,${.45 - .3 * lock})`; c.fillRect(0, by, w, Math.max(1, u * .25));
    noise(c, w, h, .05 + .3 * (1 - lock), 0, 255, 3);
    scan(c, w, h, .12);
    // VCR on-screen display, on the same margin as the mark
    const cnt = S.cnt0 + Math.floor(t), osd = `SP  ${Math.floor(cnt / 3600)}:${String(Math.floor(cnt / 60) % 60).padStart(2, '0')}:${String(cnt % 60).padStart(2, '0')}`;
    txt(c, osd, m + u * .2, 11 * u + u * .2, VT(4.4 * u), 'rgba(0,0,0,.7)');
    txt(c, osd, m, 11 * u, VT(4.4 * u), '#f4f1ea', .92);
    if (lock < 1) { txt(c, 'TRACKING', w - m + u * .2, 11 * u + u * .2, VT(4.4 * u), 'rgba(0,0,0,.7)', 1, 'right'); txt(c, 'TRACKING', w - m, 11 * u, VT(4.4 * u), '#f4f1ea', .92 * (1 - lock), 'right'); }
    // the mark, recorded on the tape: its colour smears right like everything else, then the cream on top
    const al = ramp(t, 2.9, .9), my = h - 15 * u, ms = 12.5 * u;   // only after the tracking has locked, so the mark never moves
    for (let i = 1; i <= 4; i++) mark(c, m + i * .45 * u, my, ms, 'rgba(255,120,80,.16)', al);
    mark(c, m, my, ms, CREAM, al * .96);
  },
});

// V3 — stuck pixels
V.push({
  name: 'Stuck pixels', seed: '2e4516aa08bb61575a249f379ccca76fe7e5cdf12cdadc96', L: 9.5,
  idea: 'A macro of a dead LCD. Nothing is lit except a few stuck subpixels, then more stick on until the red, green and blue stripes add up to the mark.',
  // seed → row count (byte 0), the stick order and which subpixels never light
  init(S) { S.rows = 66 + Math.round(byte(S.seed, 0) * 12); },
  draw(c, w, h, t, S) {
    if (S.w !== w) {
      S.w = w; const rows = S.rows, p = h / rows, cols = Math.floor(w / p); S.p = p; S.cols = cols;
      const mh = Math.round(rows * .46), mw = Math.round(cols * .7), ox = Math.round((cols - mw) / 2), oy = Math.round((rows - mh) / 2);
      const mk = mask('/D.I.R.', mw, mh), r = rng(S.seed.slice(6));
      S.lit = [];   // [x, y, channel, stickTime]
      for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (mk.on[y * mw + x]) for (let k = 0; k < 3; k++) { if (r() < .012) continue; S.lit.push([x + ox, y + oy, k, 1 + 3.9 * Math.pow(r(), .45)]); }
      for (let n = 0; n < 14; n++) S.lit.push([Math.floor(r() * cols), Math.floor(r() * rows), Math.floor(r() * 3), -1]);   // the stuck ones, lit from the start
      // the unlit lattice, rendered once: the same three stripes everywhere, barely tinted
      const bg = S.bg = document.createElement('canvas'); bg.width = w; bg.height = h; const b = bg.getContext('2d');
      b.fillStyle = '#030303'; b.fillRect(0, 0, w, h);
      const sw = p / 3, off = ['#150909', '#091509', '#09091a'];
      for (let k = 0; k < 3; k++) { b.fillStyle = off[k]; for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) b.fillRect(x * p + k * sw + sw * .12, y * p + p * .08, sw * .76, p * .84); }
    }
    c.drawImage(S.bg, 0, 0);
    const p = S.p, sw = p / 3, col = ['#ff2d1c', '#2cff4e', '#2a5cff'];
    for (const [x, y, k, ts] of S.lit) {
      const a = ts < 0 ? 1 : ramp(t, ts, .12); if (a <= 0) continue;
      c.globalAlpha = a; c.fillStyle = col[k]; c.fillRect(x * p + k * sw + sw * .12, y * p + p * .08, sw * .76, p * .84);
    }
    c.globalAlpha = 1;
    // a lit subpixel leaks a little into its neighbours
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .28; c.filter = `blur(${p * .35}px)`; c.drawImage(c.canvas, 0, 0); c.restore();
  },
});

// V4 — phone LCD
V.push({
  name: 'Phone LCD', seed: '569312424a7aefd16ef41844b4e60733fc10cc851eac4b1e', L: 9,
  idea: 'An 84 by 48 monochrome phone screen boots. The backlight comes up green, and the mark settles in with the lag of liquid crystal, one pixel after another. Every pixel is on the same grid; the clock is real.',
  // seed → backlight hue (byte 0), lag spread (byte 1)
  init(S) { S.lit = mix('#b9cf49', '#9fd36a', byte(S.seed, 0)); S.lag = .5 + byte(S.seed, 1) * .8; },
  draw(c, w, h, t, S) {
    const u = h / 100, CW = 84, CH = 48;
    if (!S.on) {
      S.on = new Float32Array(CW * CH).fill(-1); const r = rng(S.seed.slice(10));
      const put = tt => (x, y) => { if (x >= 0 && x < CW && y >= 0 && y < CH) S.on[y * CW + x] = tt; };
      const mw = dotWidth('/D.I.R.') * 2, top = 9;
      dotText((x, y) => { if (x >= 0 && x < CW && y >= 0 && y < CH) S.on[y * CW + x] = 1.2 + r() * S.lag; }, '/D.I.R.', Math.round((CW - mw) / 2), top, 2);
      pxText(put(3.3), 'DEAD INTERNET RADIO', Math.round((CW - pxWidth('DEAD INTERNET RADIO')) / 2), top + 22 + 5);
    }
    const ph = 84 * u, pw = ph * CW / CH, px = (w - pw) / 2, py = (h - ph) / 2, cell = ph / CH;
    c.fillStyle = '#1b1b19'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#0e0e0d'; c.beginPath(); c.roundRect(px - 3 * u, py - 3 * u, pw + 6 * u, ph + 6 * u, 1.2 * u); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = Math.max(1, u * .12); c.stroke();
    const bl = ramp(t, .5, .5);
    c.fillStyle = mix('#5f6a55', S.lit, bl); c.fillRect(px, py, pw, ph);
    // the clock rewrites itself each minute; the rest is fixed from init
    const tm = clock();
    if (S.tm !== tm) { S.tm = tm; S.clk = new Float32Array(CW * CH); pxText((x, y) => { S.clk[y * CW + x] = 1; }, tm, CW - 2 - pxWidth(tm), 1); }
    const g = cell * .06, shade = `rgba(27,34,22,.22)`;

    ctx.save(); v.draw(ctx, w, h, t, S); ctx.restore();
    // the TV-style fade to the player
    if (FREEZE === null && t > v.L - .7) { ctx.fillStyle = `rgba(0,0,0,${ramp(t, v.L - .7, .7)})`; ctx.fillRect(0, 0, w, h); }
  }
  requestAnimationFrame(frame);
}

Promise.all([
  document.fonts.load(JK(800, 40)), document.fonts.load(JK(700, 40)), document.fonts.load(JK(400, 40)),
  document.fonts.load(MONO(20)), document.fonts.load(MONO(20, 500)), document.fonts.load('20px VT100'),
]).catch(() => {}).then(() => { stages.forEach(s => s.S.start = performance.now()); requestAnimationFrame(frame); });
</script>
</body>
