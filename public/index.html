<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0a">
  <meta name="apple-mobile-web-app-title" content="DIR">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Dead Internet Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="welcome-splash">
    <iframe id="welcome-ident" title="Dead Internet Radio station ident" scrolling="no" tabindex="-1"></iframe>
    <div class="welcome-letterbox">
      <div id="welcome-dir">/D.I.R.</div>
      <div class="welcome-prompt">CLICK TO START</div>
    </div>
    <audio id="welcome-audio" preload="auto"></audio>
  </div>
  <img id="gif-bg" alt="" aria-hidden="true" crossorigin="anonymous">
  <canvas id="overlay-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <canvas id="block-canvas"></canvas>
  <iframe id="ident-frame" title="Station ident" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>

  <header id="deck">
    <div class="deck-logo">
      <div class="speaker" aria-hidden="true"></div>
      <span class="logo-text"></span>
      <span class="logo-cursor">_</span>
    </div>
    <div class="deck-mini">
      <span class="mini-track" id="mini-track">—</span>
      <span class="mini-dot"></span>
    </div>
      <div class="deck-content">
        <div class="deck-transport">
          <span class="ctrl"><span class="led" id="gallery-led"></span><button id="btn-gallery" class="abtn" title="Visual gallery (/)" aria-label="Open visuals gallery">⏏</button><label class="abtn-label" for="btn-gallery">Visuals</label></span>
          <span class="ctrl"><span class="led" id="led-play"></span><button id="btn-play" class="abtn" title="Play" aria-label="Play">▶</button><label class="abtn-label" id="play-label" for="btn-play">Play</label></span>
          <span class="ctrl"><span class="led" id="request-led"></span><button id="btn-request" class="abtn" title="Request a song" aria-label="Request a song"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 9.5C1.5 3.5 22.5 3.5 22.5 9.5V11a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V9.2C14 8.2 10 8.2 7.5 9.2V11a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1Z"/><path fill-rule="evenodd" d="M9.5 9.7h5V12c0 .4.2.7.5.9l4.6 3.2c.3.2.4.5.4.8V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3.1c0-.3.1-.6.4-.8L9 12.9c.3-.2.5-.5.5-.9ZM12 12.8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg></button><label class="abtn-label" for="btn-request">Request</label></span>
          <span class="ctrl"><span class="led" id="vote-up-led"></span><button id="btn-vote-up" class="abtn vote" title="More like this" aria-label="Like this song" disabled><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="10" width="4.5" height="12" rx="1"/><path d="M8.5 21V10.6L12.2 2.4a1 1 0 0 1 1-.4 2.9 2.9 0 0 1 2.2 3.5L14.5 9.5h5.3a2.2 2.2 0 0 1 2.1 2.8l-2.4 8.1A2.2 2.2 0 0 1 17.4 22H9.5a1 1 0 0 1-1-1Z"/></svg></button><label class="abtn-label" for="btn-vote-up">Like</label></span>
          <span class="ctrl"><span class="led" id="vote-down-led"></span><button id="btn-vote-down" class="abtn vote" title="Not for me" aria-label="Dislike this song" disabled><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="10" width="4.5" height="12" rx="1"/><path d="M8.5 21V10.6L12.2 2.4a1 1 0 0 1 1-.4 2.9 2.9 0 0 1 2.2 3.5L14.5 9.5h5.3a2.2 2.2 0 0 1 2.1 2.8l-2.4 8.1A2.2 2.2 0 0 1 17.4 22H9.5a1 1 0 0 1-1-1Z"/></svg></button><label class="abtn-label" for="btn-vote-down">Dislike</label></span>
        </div>
        <div class="npd-stack">
          <div id="np-display">
            <div class="npd-group npd-art-group">
              <div class="npd-navpair">
                <button class="npd-nav" id="npd-art-prev" title="Previous visual">▴</button>
                <button class="npd-nav" id="npd-art-next" title="Next visual">▾</button>
              </div>
              <div class="npd-lines">
                <div class="npd-line npd-artwork"></div>
                <div class="npd-line npd-show"></div>
              </div>
            </div>
            <div class="npd-group">
              <div class="npd-lines">
                <div class="npd-line npd-track"></div>
                <div class="npd-line npd-artist"></div>
              </div>
            </div>
            <canvas id="wave" class="npd-wave"></canvas>
            <div class="fx-lcd"><div class="fx-row" data-slot="2"><span class="fx-num">3</span><span class="fx-name"></span><button class="fx-on">off</button></div><div class="fx-row" data-slot="1"><span class="fx-num">2</span><span class="fx-name"></span><button class="fx-on">off</button></div><div class="fx-row" data-slot="0"><span class="fx-num">1</span><span class="fx-name"></span><button class="fx-on">off</button></div><div class="fx-row" data-slot="-1"><span class="fx-num">A</span><span class="fx-name"></span></div></div>
          </div>
          <div id="dial-readout" class="dial-readout"></div>
        </div>
        <div class="deck-display">
          <span class="ctrl"><span class="led"></span><div class="rams-knob fx-pick" title="Filter for the selected slot"><div class="knob-body"><div class="knob-tick"></div></div></div><div class="knob-label">filter</div></span>
          <span class="ctrl"><span class="led"></span><div class="rams-knob fx-wet" title="FX dry/wet"><div class="knob-body"><div class="knob-tick"></div></div></div><div class="knob-label">dry/wet</div></span>
          <span class="ctrl"><span class="led"></span><div class="rams-knob fx-p1" title=""><div class="knob-body"><div class="knob-tick"></div></div></div><div class="knob-label"></div></span>
          <span class="ctrl"><span class="led"></span><div class="rams-knob fx-p2" title=""><div class="knob-body"><div class="knob-tick"></div></div></div><div class="knob-label"></div></span>
          <span class="ctrl-divider"></span>
          <span class="ctrl"><span class="led" id="slot-led"></span><div id="slot-knob" class="rams-knob slot-knob" title="Slot preset (click to cycle, 0=off)"><div class="knob-body"><div class="knob-tick"></div></div></div><div class="knob-label">slot</div></span>
          <span class="ctrl" id="save-slot-ctrl" hidden><span class="led" id="save-slot-led"></span><button id="btn-save-slot" class="abtn" title="Save to current slot">⏺</button><div class="knob-label">save</div></span>
        </div>
      </div>
    <div class="deck-gallery"></div>
  </header>

  <audio id="player" preload="auto"></audio>
  <audio id="voiceover-el" preload="auto"></audio>
  <script src="visuals/engine.js"></script>
  <script src="visuals/filters.js"></script>
  <script src="visuals/track_hud.js"></script>
  <script src="visuals/lib/p5.js"></script>
  <script src="visuals/giphy.js"></script>
  <script src="visuals/prelinger_broll.js"></script>
  <script src="visuals/eyes.js"></script>
  <script src="visuals/rubiks.js"></script>
  <script src="visuals/grid.js"></script>
  <script src="visuals/trail.js"></script>
  <script src="visuals/bouncy.js"></script>
  <script src="visuals/twirlz.js"></script>
  <script src="visuals/bubbles.js"></script>
  <script src="visuals/branches.js"></script>
  <script src="visuals/bugs3.js"></script>
  <script src="visuals/particle_drawings.js"></script>
  <script src="visuals/word_sparks.js"></script>
  <script src="visuals/pulsing_squares.js"></script>
  <script src="visuals/system_terminal.js"></script>
  <script src="visuals/error_404.js"></script>
  <script src="visuals/swiss_clock.js"></script>
  <script src="visuals/passbook_cam.js"></script>
  <script src="visuals/glyph_board.js"></script>
  <script src="visuals/ascii_rest.js"></script>
  <script src="visuals/four_dots.js"></script>
  <script src="visuals/delayed_lerp_points2c.js"></script>
  <script src="visuals/delayed_lerp_points8.js"></script>
  <script src="visuals/delayed_lerp_points7.js"></script>
  <script src="visuals/delayed_lerp_points7b.js"></script>
  <script src="visuals/delayed_lerp_points_1600.js"></script>
  <script src="visuals/patterns2.js"></script>
  <script src="visuals/wall_drawing_26.js"></script>
  <script src="visuals/self_avoiding_walk_3d.js"></script>
  <script src="visuals/cubes_token_sha.js"></script>
  <script src="visuals/bonk.js"></script>
  <script src="visuals/modem_symphony.js"></script>
  <script src="visuals/bios_webcam.js"></script>
  <script src="visuals/sound_investigation2.js"></script>
  <script src="visuals/gallery.js"></script>
  <script src="ident.js"></script>
  <script src="app.js"></script>
  <script src="listener.js"></script>
  <script src="request.js"></script>
  <script src="votes.js"></script>
  <script src="info.js"></script>
  <script src="button-sounds.js"></script>
</body>
</html>
